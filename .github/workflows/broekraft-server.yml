name: Broekraft Server
on:
  pull_request:
    paths: ['server/**', 'spil/**', 'tilslut/**', 'billeder/**', 'index.html', 'style.css', 'effekter.js', 'manifest.json', 'sw.js', '*.png', '.github/workflows/broekraft-server.yml']
  push:
    tags: ['server-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Afprøv gåder, bilfysik, grotter og gemninger
        run: node --test spil/det-sidste-lys/*.test.mjs spil/skrotstorm/tests.mjs spil/krystaljaegerne/*.test.mjs
      - name: Afprøv generator, protokol og simulering
        working-directory: server
        run: deno task test
      - name: Byg Windows, Mac og Linux (x64 og ARM64)
        working-directory: server
        run: deno task byg
      - name: Pak programmer og vejledning
        working-directory: server/dist
        run: |
          chmod +x Mac-Intel/BroekraftServer Mac-AppleSilicon/BroekraftServer
          for platform in Windows Mac-Intel Mac-AppleSilicon; do
            (cd "$platform" && zip "../BroekraftServer-$platform.zip" BroekraftServer* LÆSMIG.md)
          done
          for platform in Linux-x64 Linux-ARM64; do
            tar -czf "BroekraftServer-$platform.tar.gz" -C "$platform" BroekraftServer installer.sh arkitektur.txt LÆSMIG.md
          done
          sha256sum BroekraftServer-*.zip BroekraftServer-*.tar.gz > SHA256SUMS.txt
      - name: Gem pakker til manuel afprøvning
        uses: actions/upload-artifact@v4
        with:
          name: BroekraftServer
          path: |
            server/dist/*.zip
            server/dist/*.tar.gz
            server/dist/SHA256SUMS.txt
  linux-test:
    needs: byg
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux-x64
            runner: ubuntu-24.04
          - platform: Linux-ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BroekraftServer
          path: server/dist
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Afprøv installation og HTTPS på ${{ matrix.platform }}
        run: sh server/tests/linux-installation.sh
  udgiv:
    needs: [byg, linux-test]
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BroekraftServer
          path: server/dist
      - name: Udgiv tag som GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" server/dist/*.zip server/dist/*.tar.gz server/dist/SHA256SUMS.txt --verify-tag --title "Broekraft Server $TAG" --notes-file server/UDGIVELSE.md
