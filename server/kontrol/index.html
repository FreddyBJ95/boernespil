<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Broekraft Server</title><link rel="stylesheet" href="/kontrol/kontrol.css"></head>
<body>
  <h1>Broekraft Server</h1>
  <p>Lad programmet være åbent, mens børnene spiller.</p>
  <p id="besked" role="status" aria-live="polite"></p>
  <section><h2>Forbind tabletterne</h2><div id="adresser"></div></section>
  <section><h2>Opret verden</h2>
    <form id="opret">
      <label>Verdensnavn <input name="navn" required maxlength="60" autocomplete="off"></label>
      <label>Verdenstype <select name="type"><option value="græsø">Græsøen</option><option value="zombie">Zombieverdenen</option><option value="svampe">Svampeverdenen</option><option value="maane">Ostemånen</option></select></label>
      <label>Størrelse <select name="bredde"><option value="128">Lille · 128 × 128</option><option value="256">Mellem · 256 × 256</option><option value="512">Stor · 512 × 512</option><option value="1024">Kæmpe · 1024 × 1024</option></select></label>
      <label>Antal spillere <input name="maksSpillere" type="number" min="1" max="8" value="4" required></label>
      <label>Frø (valgfrit) <input name="frø" type="number" min="0" max="4294967295" step="1"></label>
      <label><input name="ildBreder" type="checkbox" checked> Ild breder sig</label>
      <button>Opret verden</button>
    </form>
    <div id="job" aria-live="polite"></div>
  </section>
  <section><h2>Verdener</h2><div id="verdener"></div></section>
  <section><h2>Spillere</h2><ul id="spillere"></ul></section>
  <p id="lagring"></p><p><a href="/test-klient.html" target="_blank">Åbn testklient</a></p>
  <script src="/kontrol/qrcode.js"></script><script type="module" src="/kontrol/kontrol.js"></script>
</body>
</html>
