<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Min enhjørning 🦄</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: ui-rounded, "SF Pro Rounded", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #ffe3f3; color: #5a2b6b;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    .top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; pointer-events: none;
    }
    .top > * { pointer-events: auto; }
    .rund {
      font-size: 26px; text-decoration: none; background: rgba(255,255,255,.92); border-radius: 50%;
      width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(120,40,120,.2);
    }
    .hjerter {
      font-size: 24px; font-weight: 900; background: rgba(255,255,255,.92); border-radius: 999px;
      padding: 8px 18px; box-shadow: 0 4px 14px rgba(120,40,120,.18); white-space: nowrap;
    }
    .hjerter.hop { animation: hop .45s cubic-bezier(.2,1.6,.4,1); }
    @keyframes hop { 40% { transform: scale(1.3); } }

    /* Forneden: værktøjer/valg for den fane, man står på, og de fire faner */
    .bund {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,240,250,.97));
      border-radius: 26px 26px 0 0; box-shadow: 0 -6px 24px rgba(150,60,150,.18);
    }
    .chips, .valg, .faner { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .chips { margin-bottom: 8px; }
    .chip {
      width: 50px; height: 40px; border-radius: 14px; border: none; background: #f6e8f8; cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .chip canvas { width: 34px; height: 34px; pointer-events: none; }
    .chip.valgt { background: #ffd6f0; box-shadow: 0 0 0 3px #ff7eb6; }
    .valg { min-height: 60px; align-items: center; margin-bottom: 8px; }
    .vbtn {
      width: 58px; height: 58px; border-radius: 50%; border: 4px solid #fff; padding: 0; cursor: pointer;
      box-shadow: 0 3px 8px rgba(120,40,120,.25); font-size: 30px; line-height: 1;
      display: flex; align-items: center; justify-content: center; background: #fff; transition: transform .12s;
    }
    .vbtn canvas { width: 46px; height: 46px; pointer-events: none; }
    .vbtn.valgt { transform: scale(1.14); box-shadow: 0 0 0 4px #ff7eb6, 0 3px 8px rgba(120,40,120,.25); }
    .vbtn:active { transform: scale(.9); }
    .faner { gap: 10px; }
    .fane {
      flex: 1; max-width: 120px; height: 58px; border: none; border-radius: 18px; cursor: pointer;
      font-size: 32px; background: #f3e3f7; box-shadow: 0 3px 0 #e3c4ea;
    }
    .fane.valgt { background: linear-gradient(180deg, #ffb3dc, #ff7eb6); box-shadow: 0 3px 0 #d94f93; transform: translateY(-3px); }

    @media (max-width: 520px), (max-height: 600px) {
      .vbtn { width: 48px; height: 48px; font-size: 25px; border-width: 3px; }
      .vbtn canvas { width: 38px; height: 38px; }
      .fane { height: 48px; font-size: 26px; }
      .chip { width: 44px; height: 36px; }
      .valg { min-height: 50px; }
      .rund { width: 44px; height: 44px; font-size: 22px; }
      .hjerter { font-size: 19px; padding: 6px 14px; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="top">
    <a class="rund" href="../../">🏠</a>
    <div class="hjerter" id="hjerteBoks">❤️ <span id="hjerter">0</span></div>
  </div>
  <div class="bund" id="bund">
    <div class="chips" id="chips"></div>
    <div class="valg" id="valg"></div>
    <div class="faner" id="faner"></div>
  </div>

  <script src="../../effekter.js"></script>
  <script>
    // ===== Min enhjørning =====
    // 🎨 Lav din egen enhjørning: farve, man, horn, vinger og mærke.
    // 🎀 Pynt den med sadel, noget på hovedet og noget på benene.
    // 🧽 Den hopper i mudder — vask den med svamp og bruser, tør den med føn, og børst manen.
    // 🍎 Giv den mad. Tryk på den, så vrinsker den, hopper, laver magi med hornet eller flyver.
    // Enhjørningen huskes på enheden til næste gang.

    const $ = id => document.getElementById(id);
    const TAU = Math.PI * 2;
    const klem = (v, a, b) => Math.max(a, Math.min(b, v));
    const tilf = (a, b) => a + Math.random() * (b - a);

    // ---------- Valgmulighederne ----------
    const KROP = ["#ffffff", "#ffd6ec", "#e3d4ff", "#c9f2df", "#cfe9ff", "#fff1b8", "#ffc9a8", "#4a3f6b"];
    const MAN = {                                   // farverne i manen og halen
      regnbue: ["#ff5c8a", "#ff9f1c", "#ffd23f", "#4cd964", "#2ec4f1", "#9b5de5"],
      lyserød: ["#ff7eb6", "#ffb3dc", "#ff5c9a"],
      lilla:   ["#9b5de5", "#c39bff", "#7b3fd1"],
      blå:     ["#2ec4f1", "#8fe0ff", "#1d8fd8"],
      mint:    ["#34d399", "#a7f3d0", "#10b981"],
      guld:    ["#ffd23f", "#fff1a8", "#f0a500"],
      ild:     ["#ff4d2e", "#ff9f1c", "#ffd23f"],
      galakse: ["#3b1d8f", "#7b3fd1", "#ff7eb6", "#2ec4f1"],
    };
    const HORN = {
      guld:    ["#fff4b0", "#ffc928", "#c98a00"],
      sølv:    ["#ffffff", "#dfe5ee", "#9aa4b5"],
      regnbue: null,
      krystal: ["#f2fbff", "#bfe9ff", "#ff9fd0"],
      lyserød: ["#ffe1f1", "#ff8fc6", "#d94f93"],
    };
    const VINGER = ["ingen", "hvid", "lyserød", "regnbue", "guld"];
    const MÆRKER = ["", "⭐", "❤️", "🌈", "🌸", "🦋", "⚡", "🍓"];
    const SADLER = {
      ingen:   null,
      hjerter: { sadel: "#ff7eb6", dækken: "#ffe1f1", kant: "#ffffff", rem: "#c94f86", pynt: "hjerter" },
      cowboy:  { sadel: "#a0622d", dækken: "#e8463a", kant: "#ffffff", rem: "#6b3d15", pynt: "cowboy" },
      konge:   { sadel: "#7b2cbf", dækken: "#ffd23f", kant: "#fff2a8", rem: "#4a1a7a", pynt: "konge" },
      regnbue: { sadel: "#ffffff", dækken: "regnbue", kant: "#ffffff", rem: "#9b5de5", pynt: "" },
      stjerner:{ sadel: "#3a86ff", dækken: "#cfe6ff", kant: "#ffffff", rem: "#1d4ed8", pynt: "stjerner" },
    };
    const HOVED = ["ingen", "krans", "krone", "sløjfe", "briller", "hat"];
    const BEN = ["ingen", "varmere", "regnbuevarmere", "glitterhove"];
    const MAD = [
      { e: "🥕" }, { e: "🍎" }, { e: "🍓" }, { e: "🍉" }, { e: "🍪" },
      { e: "🧁", glimmer: true }, { e: "🍭", glimmer: true },
    ];

    // ---------- Det, der huskes ----------
    const STANDARD = { krop: "#ffffff", man: "regnbue", horn: "guld", vinger: "ingen", mærke: "⭐", sadel: "ingen", hoved: "krans", ben: "ingen", hjerter: 0 };
    let d = { ...STANDARD };
    try { Object.assign(d, JSON.parse(localStorage.getItem("enhjoerning") || "{}")); } catch (_) {}
    function gem() { try { localStorage.setItem("enhjoerning", JSON.stringify(d)); } catch (_) {} }
    function giHjerter(n) {
      d.hjerter += n; gem(); $("hjerter").textContent = d.hjerter;
      const el = $("hjerteBoks"); el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
    }

    // ---------- Farvehjælpere ----------
    function blandet(hex, med, t) {                 // bland to farver (t = 0..1)
      const a = parseInt(hex.slice(1), 16), b = parseInt(med.slice(1), 16);
      const f = s => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
      return `rgb(${f(16)}, ${f(8)}, ${f(0)})`;
    }
    const mørkere = (hex, t) => blandet(hex, "#3a1450", t);
    const lysere = (hex, t) => blandet(hex, "#ffffff", t);
    function rr(c, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      c.beginPath(); c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
    }
    function hjerteSti(c, x, y, s) {
      c.beginPath(); c.moveTo(x, y + s * 0.8);
      c.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.6, y - s * 1.3, x, y - s * 0.45);
      c.bezierCurveTo(x + s * 0.6, y - s * 1.3, x + s * 1.6, y - s * 0.2, x, y + s * 0.8);
    }
    function stjerneSti(c, x, y, r, takker = 5) {
      c.beginPath();
      for (let i = 0; i < takker * 2; i++) {
        const rr2 = i % 2 ? r * 0.45 : r, a = Math.PI / takker * i - Math.PI / 2;
        c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
      }
      c.closePath();
    }

    // ===================================================================
    // ---------- Enhjørningen. Den vender mod højre; jorden er y = 520 ----------
    // ===================================================================
    const KASSE = { x: -15, y: -80, b: 700, h: 610 };   // det område enhjørningen fylder (i dens egne mål)
    const HALSLED = { x: 400, y: 262 };                // hovedet drejer en smule omkring halsens bund

    // Pelsens former (bruges både til farver, omrids og som "maske" til mudder)
    function benSti(c, x, b, top = 320) { rr(c, x - b / 2, top, b, 520 - top, b * 0.45); }
    function halsSti(c) {
      c.beginPath(); c.moveTo(355, 255);
      c.bezierCurveTo(372, 175, 415, 112, 468, 92);
      c.lineTo(548, 150);
      c.bezierCurveTo(505, 200, 475, 255, 470, 335);
      c.closePath();
    }
    function øreSti(c, vip, lille = 1) {
      c.save(); c.translate(466, 80); c.rotate(-0.22 + vip); c.scale(lille, lille);
      c.beginPath(); c.moveTo(-22, 4); c.quadraticCurveTo(-16, -58, 8, -84); c.quadraticCurveTo(28, -40, 22, 6); c.closePath();
      c.restore();
    }
    // fn kaldes én gang for hver form med den rigtige drejning af hovedet
    function pelsFormer(c, p, fn) {
      for (const [x, y, rx, ry, rot] of [[300, 300, 165, 100, -0.04], [422, 288, 72, 88, 0], [180, 290, 82, 92, 0]]) {
        c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); fn();
      }
      benSti(c, 198, 52); fn(); benSti(c, 422, 52); fn();
      c.save(); c.translate(HALSLED.x, HALSLED.y); c.rotate(p.hoved); c.translate(-HALSLED.x, -HALSLED.y);
      halsSti(c); fn();
      c.beginPath(); c.arc(500, 140, 76, 0, TAU); fn();
      c.beginPath(); c.ellipse(570, 184, 57, 47, 0.32, 0, TAU); fn();
      øreSti(c, p.øre); fn();
      c.restore();
    }

    // Hele enhjørningen. p = stillingen: hoved (drejning), øre, hale, blink, mund, vinge, ånde, glans
    function tegnEnhjørning(c, t, p, vis = { udstyr: true }) {
      const KF = d.krop, streg = mørkere(KF, 0.55), mørk = mørkere(KF, 0.12);
      const manF = MAN[d.man] || MAN.regnbue;
      // halen bagerst
      tegnHale(c, t, p, manF);
      // de fjerne ben (lidt mørkere, de står bag kroppen)
      for (const x of [244, 388]) {
        benSti(c, x, 46, 300);
        c.fillStyle = mørk; c.fill(); c.lineWidth = 5; c.strokeStyle = streg; c.stroke();
        c.save(); c.globalAlpha = 0.18; c.fillStyle = "#3a1450"; c.fill(); c.restore();
        tegnHov(c, x, 46, true);
        if (vis.udstyr) tegnBenpynt(c, x, 46, true);
      }
      // pelsen: først omrids rundt om det hele, så farven ovenpå (så det bliver én samlet form)
      pelsFormer(c, p, () => { c.lineWidth = 11; c.strokeStyle = streg; c.lineJoin = "round"; c.stroke(); });
      const g = c.createRadialGradient(330, 200, 30, 330, 300, 330);
      g.addColorStop(0, lysere(KF, 0.35)); g.addColorStop(0.65, KF); g.addColorStop(1, mørkere(KF, 0.1));
      pelsFormer(c, p, () => { c.fillStyle = g; c.fill(); });
      // hove på de nære ben
      for (const x of [198, 422]) { tegnHov(c, x, 52, false); if (vis.udstyr) tegnBenpynt(c, x, 52, false); }
      // mærket på bagdelen
      if (d.mærke) {
        c.save(); c.translate(172, 305); c.rotate(-0.15);
        c.font = "56px system-ui, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
        c.globalAlpha = 0.95; c.fillText(d.mærke, 0, 0); c.restore();
      }
      // sadlen, og vingen (på den nære side) foran sadlen
      if (vis.udstyr && d.sadel !== "ingen") tegnSadel(c, t, p);
      if (d.vinger !== "ingen") tegnVinge(c, t, p, manF);
      // hovedet: øjne, mund, man, horn og pynt — drejet med hovedet
      c.save(); c.translate(HALSLED.x, HALSLED.y); c.rotate(p.hoved); c.translate(-HALSLED.x, -HALSLED.y);
      tegnMan(c, t, p, manF);
      // indersiden af øret
      øreSti(c, p.øre, 0.6); c.fillStyle = "#ffb3d4"; c.fill();
      tegnAnsigt(c, t, p);
      if (vis.udstyr && d.sadel !== "ingen") tegnHovedtøj(c, t, p);
      if (vis.udstyr && d.hoved === "hat") tegnHovedpynt(c, t, p);
      tegnPandehår(c, t, p, manF);
      tegnHorn(c, t, p);
      if (vis.udstyr && d.hoved !== "hat") tegnHovedpynt(c, t, p);
      c.restore();
    }

    function tegnHov(c, x, b, fjern) {
      const glimmer = d.ben === "glitterhove";
      rr(c, x - b / 2 - 1, 494, b + 2, 27, 9);
      c.fillStyle = glimmer ? "#ffd23f" : mørkere(d.krop, fjern ? 0.62 : 0.5); c.fill();
      c.lineWidth = 4; c.strokeStyle = mørkere(d.krop, 0.7); c.stroke();
      if (glimmer) {
        c.fillStyle = "#fff8d0";
        for (let i = 0; i < 4; i++) { stjerneSti(c, x - b / 2 + 8 + i * (b - 14) / 3, 503 + (i % 2) * 8, 4, 4); c.fill(); }
      }
    }
    function tegnBenpynt(c, x, b, fjern) {          // benvarmere: stribede, lodne bånd om underbenene
      if (d.ben !== "varmere" && d.ben !== "regnbuevarmere") return;
      const farver = d.ben === "varmere" ? ["#ff7eb6", "#ffffff"] : MAN.regnbue;
      c.save();
      rr(c, x - b / 2 - 6, 420, b + 12, 72, 14); c.clip();
      for (let i = 0; i < 8; i++) { c.fillStyle = farver[i % farver.length]; c.fillRect(x - b, 420 + i * 9, b * 2, 9); }
      if (fjern) { c.fillStyle = "rgba(58,20,80,.18)"; c.fillRect(x - b, 420, b * 2, 72); }
      c.restore();
      rr(c, x - b / 2 - 6, 420, b + 12, 72, 14); c.lineWidth = 3; c.strokeStyle = "rgba(90,40,100,.45)"; c.stroke();
    }

    // Halen: tykke lokker, der svajer
    function tegnHale(c, t, p, farver) {
      const n = 7;
      for (let i = n - 1; i >= 0; i--) {
        const sving = Math.sin(t * 1.7 + i * 0.6) * 14 * p.hale + p.haleSlag * Math.sin(t * 18 + i) * 25;
        const rx = 118 + i * 3, ry = 236 + i * 7;
        const tx = 46 - i * 7 + sving, ty = 372 + i * 19;
        lok(c, rx, ry, tx, ty, 50 - i * 2, 18 + sving * 0.8, farver[i % farver.length]);
      }
    }
    // En lok hår fra rod til spids, buet lidt (bøj = hvor meget den bugter)
    function lok(c, rx, ry, tx, ty, b, bøj, farve) {
      const dx = tx - rx, dy = ty - ry, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
      const mx = (rx + tx) / 2 + nx * (20 + bøj), my = (ry + ty) / 2 + ny * (20 + bøj);
      c.beginPath();
      c.moveTo(rx + nx * b / 2, ry + ny * b / 2);
      c.quadraticCurveTo(mx + nx * b * 0.6, my + ny * b * 0.6, tx, ty);
      c.quadraticCurveTo(mx - nx * b * 0.3, my - ny * b * 0.3, rx - nx * b / 2, ry - ny * b / 2);
      c.closePath();
      c.fillStyle = farve; c.fill();
      c.lineWidth = 4; c.strokeStyle = mørkere(farve.startsWith("#") ? farve : "#ffffff", 0.35); c.stroke();
      c.strokeStyle = "rgba(255,255,255,.45)"; c.lineWidth = 3;                    // glans i håret
      c.beginPath(); c.moveTo(rx + nx * b * 0.15, ry + ny * b * 0.15); c.quadraticCurveTo(mx + nx * b * 0.2, my + ny * b * 0.2, tx * 0.3 + mx * 0.7, ty * 0.3 + my * 0.7); c.stroke();
    }
    // Manen ned langs halsen
    function tegnMan(c, t, p, farver) {
      const n = 8;
      for (let i = n - 1; i >= 0; i--) {
        const s = i / (n - 1);
        const rx = 476 - s * 120 + Math.sin(s * 3) * 6, ry = 86 + s * 158;            // langs halsens bagkant
        const sving = Math.sin(t * 2 + i * 0.8) * 7;
        lok(c, rx, ry, rx - 34 - s * 26 + sving, ry + 88 + s * 22, 50, 14 + sving * 0.6, farver[i % farver.length]);
      }
    }
    function tegnPandehår(c, t, p, farver) {
      const sving = Math.sin(t * 2.2) * 4;
      lok(c, 492, 70, 534 + sving, 112, 30, -10, farver[0]);
      lok(c, 482, 76, 512 + sving, 122, 24, -8, farver[1 % farver.length]);
    }

    function tegnAnsigt(c, t, p) {
      // kind
      c.fillStyle = "rgba(255,120,170,.4)"; c.beginPath(); c.ellipse(550, 172, 18, 11, 0.2, 0, TAU); c.fill();
      // næsebor
      c.fillStyle = mørkere(d.krop, 0.55); c.beginPath(); c.ellipse(606, 178, 5, 8, 0.5, 0, TAU); c.fill();
      // mund: et smil, eller åben når den tygger
      if (p.mund > 0.05) {
        const h = 4 + p.mund * 9;
        c.fillStyle = "#7a1c40"; c.beginPath(); c.ellipse(592, 210, 15, h, 0.25, 0, TAU); c.fill();
        c.fillStyle = "#ff8fb0"; c.beginPath(); c.ellipse(592, 210 + h * 0.4, 9, h * 0.45, 0.25, 0, TAU); c.fill();
      } else {
        c.strokeStyle = mørkere(d.krop, 0.6); c.lineWidth = 4; c.lineCap = "round";
        c.beginPath(); c.moveTo(574, 206); c.quadraticCurveTo(590, 218, 607, 205); c.stroke();
      }
      // øjet: stort og blankt med lange vipper — eller lukket, når den blinker eller er glad
      const ex = 524, ey = 130;
      if (p.blink > 0.5 || p.glad > 0) {
        c.strokeStyle = "#2a1236"; c.lineWidth = 5; c.lineCap = "round";
        c.beginPath(); c.arc(ex, ey + (p.glad > 0 ? 6 : 0), 15, p.glad > 0 ? Math.PI * 1.1 : 0.15, p.glad > 0 ? Math.PI * 1.9 : Math.PI - 0.15, false); c.stroke();
      } else {
        c.fillStyle = "#2a1236"; c.beginPath(); c.ellipse(ex, ey, 17, 22, 0, 0, TAU); c.fill();
        c.fillStyle = "#6a3c8f"; c.beginPath(); c.ellipse(ex + 2, ey + 8, 11, 11, 0, 0, TAU); c.fill();
        c.fillStyle = "#ffffff";
        c.beginPath(); c.arc(ex - 5, ey - 8, 6.5, 0, TAU); c.fill();
        c.beginPath(); c.arc(ex + 6, ey + 7, 3, 0, TAU); c.fill();
      }
      c.strokeStyle = "#2a1236"; c.lineWidth = 4; c.lineCap = "round";               // vipper
      for (const [x0, y0, x1, y1] of [[534, 116, 548, 104], [538, 124, 555, 117], [527, 110, 534, 95]]) {
        c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo((x0 + x1) / 2 + 3, (y0 + y1) / 2 - 3, x1, y1); c.stroke();
      }
    }

    // Hornet med snoede striber
    function tegnHorn(c, t, p) {
      const sti = () => { c.beginPath(); c.moveTo(503, 80); c.quadraticCurveTo(526, 10, 550, -58); c.quadraticCurveTo(545, 10, 540, 72); c.closePath(); };
      const valg = HORN[d.horn];
      sti();
      if (valg) {
        const g = c.createLinearGradient(503, 0, 545, 0);
        g.addColorStop(0, valg[0]); g.addColorStop(0.5, valg[1]); g.addColorStop(1, valg[2]);
        c.fillStyle = g; c.fill();
      } else { c.fillStyle = "#ffffff"; c.fill(); }
