<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rulle Rasmus 🟢</title>
  <meta name="theme-color" content="#2a2470">
  <style>
    :root { --rasmus: #2f8cff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: ui-rounded, "SF Pro Rounded", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #cde9ff; color: #1b2440;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .skjult { display: none !important; }
    button { font: inherit; color: inherit; }

    /* ---------- runde knapper ---------- */
    .rund {
      font-size: 26px; text-decoration: none; background: rgba(255,255,255,.9); border-radius: 50%;
      width: 54px; height: 54px; min-width: 54px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.22), inset 0 -3px 0 rgba(0,0,0,.08); border: none; padding: 0; cursor: pointer;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .rund:active { transform: scale(.9); }

    /* ---------- menuen ---------- */
    .menu {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); pointer-events: none;
    }
    .menu > * { pointer-events: auto; }
    .menu-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .titel {
      margin: 2px 0 0; text-align: center; flex: 1; font-weight: 900; line-height: .95;
      font-size: clamp(44px, 9vw, 92px); letter-spacing: -1px;
      filter: drop-shadow(0 3px 0 #ff7a1a) drop-shadow(0 6px 0 #c2410c) drop-shadow(0 12px 16px rgba(0,0,0,.35));
      animation: rulle 3.2s ease-in-out infinite; pointer-events: none;
    }
    .titel span {
      display: inline-block; animation: hoppe 1.6s ease-in-out infinite; padding: 0 2px;
      background: linear-gradient(180deg, #ffffff 0%, #fff6b0 45%, #ffc93c 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    @keyframes rulle { 50% { transform: rotate(-2deg) translateY(3px); } }
    @keyframes hoppe { 50% { transform: translateY(-6px) scale(1.04, .96); } }
    .menu-top .plads { width: 54px; }

    .panel {
      margin: 0 auto; width: min(980px, 100%); max-height: 62vh; overflow-y: auto; touch-action: pan-y;
      background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.7));
      -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
      border-radius: 30px; padding: 14px 16px 16px; box-shadow: 0 18px 50px rgba(20,20,60,.35), inset 0 1px 0 rgba(255,255,255,.9);
      opacity: 0; transform: translateY(30px); transition: opacity .5s, transform .6s cubic-bezier(.2,1.3,.4,1);
    }
    .menu.klar .panel { opacity: 1; transform: none; }
    .henter { text-align: center; font-size: 20px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
    .menu.klar .henter { display: none; }
    .raekke-titel { display: flex; align-items: baseline; gap: 10px; font-weight: 900; font-size: 19px; margin: 2px 4px 8px; opacity: .85; }
    .raekke-titel em { font-style: normal; font-weight: 800; color: #6b4de6; }

    .skins { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 14px; }
    .skin {
      width: 52px; height: 52px; border-radius: 50%; border: 4px solid #fff; cursor: pointer; padding: 0; position: relative;
      background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.85) 0 8%, transparent 26%),
                  radial-gradient(circle at 50% 60%, var(--farve), color-mix(in srgb, var(--farve) 60%, #000) 100%);
      box-shadow: 0 5px 12px rgba(0,0,0,.25); transition: transform .15s;
    }
    .skin span { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
    .skin.saerlig { display: flex; align-items: center; justify-content: center; }
    .skin[data-skin="ild"] { background: radial-gradient(circle at 50% 70%, #ffd35a, #ff5a14 45%, #6b0c00); }
    .skin[data-skin="enhjorning"] { background: conic-gradient(from 30deg, #ffd6ef, #e3d6ff, #d6f3ff, #d6ffe9, #fff6c8, #ffd6ef); }
    .skin[data-skin="broekraft"] { border-radius: 12px; background: linear-gradient(180deg, #6dbb44 0 34%, #8a5a36 34%); image-rendering: pixelated; }
    .skin[data-skin="regnbue"] { background: conic-gradient(#ff3b3b, #ff9a1f, #ffe23b, #3ddc55, #2f9bff, #b05bff, #ff3b3b); }
    .skin[data-skin="galakse"] { background: radial-gradient(circle at 30% 30%, #fff 0 2%, transparent 3%), radial-gradient(circle at 70% 60%, #fff 0 2%, transparent 3%), radial-gradient(circle at 50% 50%, #8a3cc8, #1a0b4a 70%); }
    .skin[data-skin="guld"] { background: radial-gradient(circle at 35% 30%, #fff6c8, #ffc933 40%, #a86b00); }
    .skin.valgt { transform: scale(1.18); border-color: #ffd23f; box-shadow: 0 0 0 4px rgba(255,210,63,.45), 0 8px 18px rgba(0,0,0,.3); }
    .skin:active { transform: scale(.9); }

    .baner { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    /* sværhedsgrad: tre knapper ved siden af hinanden */
    .svaerhed {
      margin-left: auto; display: flex; gap: 4px; padding: 4px; border-radius: 999px;
      background: rgba(30,40,90,.1); box-shadow: inset 0 2px 4px rgba(0,0,0,.08);
    }
    .sv {
      border: none; cursor: pointer; border-radius: 999px; padding: 6px 12px; font-size: 16px; font-weight: 900;
      background: transparent; color: #1b2440; opacity: .75; display: flex; align-items: center; gap: 5px; transition: background .2s, transform .15s;
    }
    .sv span { font-size: 20px; }
    .sv:active { transform: scale(.92); }
    .sv.valgt { opacity: 1; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.2), inset 0 -3px 0 rgba(0,0,0,.15); }
    .sv.valgt[data-sv="nem"] { background: linear-gradient(180deg, #5fe07a, #22b04a); }
    .sv.valgt[data-sv="mellem"] { background: linear-gradient(180deg, #ffc15a, #ff8a1f); }
    .sv.valgt[data-sv="svær"] { background: linear-gradient(180deg, #ff6b8a, #e8283c); }
    .sv-maerke {
      font-size: 24px; width: 46px; height: 46px; min-width: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.2), inset 0 -3px 0 rgba(0,0,0,.15); pointer-events: none; background: #22b04a;
    }
    .sv-maerke[data-sv="mellem"] { background: #ff8a1f; }
    .sv-maerke[data-sv="svær"] { background: #e8283c; }
    .bane-kort {
      cursor: pointer; border: none; border-radius: 22px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: linear-gradient(180deg, #ffffff, #eef3ff); box-shadow: 0 8px 18px rgba(30,40,90,.22), inset 0 -4px 0 rgba(60,70,140,.12);
    }
    .bane-kort:active { transform: scale(.94); }
    .bane-ikon { font-size: 44px; line-height: 1.1; animation: vippe 2.4s ease-in-out infinite; }
    .bane-kort:nth-child(2n) .bane-ikon { animation-delay: -1.2s; }
    @keyframes vippe { 50% { transform: translateY(-5px) rotate(-6deg); } }
    .bane-kort b { font-size: 18px; font-weight: 900; }
    .bane-kort small { font-size: 14px; font-weight: 800; opacity: .75; min-height: 18px; }
    .bane-kort[data-bane="engen"] { background: linear-gradient(180deg, #ffffff, #e5f8d8); }
    .bane-kort[data-bane="slik"] { background: linear-gradient(180deg, #ffffff, #ffe0f0); }
    .bane-kort[data-bane="is"] { background: linear-gradient(180deg, #ffffff, #dff2ff); }
    .bane-kort[data-bane="jungle"] { background: linear-gradient(180deg, #ffffff, #d9f5e0); }
    .bane-kort[data-bane="regnbue"] { background: linear-gradient(180deg, #ffffff, #efe0ff); }
    @media (max-width: 620px) {
      .baner { grid-template-columns: repeat(3, 1fr); }
      .raekke-titel { flex-wrap: wrap; }
      .svaerhed { margin: 6px auto 0; }
      .sv { padding: 6px 10px; font-size: 15px; }
      .skin { width: 44px; height: 44px; }
      .bane-ikon { font-size: 36px; }
    }

    /* ---------- mens man spiller ---------- */
    .hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
      padding: max(10px, env(safe-area-inset-top)) 12px 10px; pointer-events: none;
    }
    .hud > * { pointer-events: auto; }
    .hud .gruppe { display: flex; gap: 8px; }
    .frem { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; pointer-events: none; }
    .frem-bar {
      position: relative; flex: 1; height: 16px; border-radius: 10px; background: rgba(255,255,255,.75);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.2), 0 3px 10px rgba(0,0,0,.18); margin: 0 14px;
    }
    .frem-fyld { height: 100%; width: 0; border-radius: 10px; background: linear-gradient(90deg, #7cf06b, #2fd24a); transition: width .3s; }
    .frem-flag { position: absolute; top: -7px; width: 4px; height: 30px; margin-left: -2px; border-radius: 2px; background: rgba(255,255,255,.95); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .frem-rasmus {
      position: absolute; top: 50%; width: 34px; height: 30px; margin: -17px 0 0 -17px; border-radius: 50% 50% 46% 46%;
      background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.8) 0 8%, transparent 22%), var(--rasmus);
      box-shadow: 0 3px 8px rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.18); transition: left .3s;
    }
    .frem-rasmus::before, .frem-rasmus::after {
      content: ""; position: absolute; top: 7px; width: 8px; height: 10px; border-radius: 50%;
      background: radial-gradient(circle at 50% 60%, #111 0 38%, #fff 40%);
    }
    .frem-rasmus::before { left: 8px; } .frem-rasmus::after { right: 8px; }
    .frem-maal { font-size: 28px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
    .stjerner {
      font-size: 24px; font-weight: 900; background: rgba(255,255,255,.9); border-radius: 999px; padding: 8px 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,.2); white-space: nowrap;
    }
    .stjerner.hop { animation: hop .45s cubic-bezier(.2,1.6,.4,1); }
    @keyframes hop { 40% { transform: scale(1.3); } }

    .besked {
      position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 9;
      width: max-content; max-width: calc(100vw - 32px); text-align: center; font-size: clamp(18px, 3vw, 24px); font-weight: 800;
      background: rgba(255,255,255,.92); padding: 10px 22px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.2);
      pointer-events: none; animation: ind .5s cubic-bezier(.2,1.4,.4,1);
    }
    @keyframes ind { from { transform: translate(-50%, 150%); } }

    /* ---------- i mål ---------- */
    .maal-kort {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 12;
      width: min(460px, calc(100vw - 32px)); text-align: center; padding: 16px 20px 20px;
      background: rgba(255,255,255,.94); border-radius: 30px; box-shadow: 0 16px 44px rgba(0,0,0,.35);
      animation: kortInd .6s cubic-bezier(.2,1.4,.4,1);
    }
    @keyframes kortInd { from { transform: translate(-50%, 140%); } }
    .maal-titel {
      font-size: clamp(28px, 6vw, 40px); font-weight: 900; margin: 0;
      background: linear-gradient(90deg, #ff477e, #ff9f1c, #06d6a0, #3a86ff, #b15bff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .maal-stjerner { font-size: 54px; line-height: 1.2; margin: 4px 0; }
    .maal-stjerner span { display: inline-block; filter: grayscale(1) opacity(.3); transform: scale(.6); animation: stjerneInd .5s cubic-bezier(.2,1.8,.4,1) forwards; }
    .maal-stjerner span.fuld { filter: none; }
    @keyframes stjerneInd { to { transform: scale(1); } }
    .maal-tal { font-size: 18px; font-weight: 800; opacity: .7; margin-bottom: 12px; }
    .knapper { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .knap {
      font-weight: 900; font-size: 22px; color: #fff; cursor: pointer; border: none; border-radius: 20px; padding: 12px 22px;
      background: linear-gradient(180deg, #ff9f1c, #ff477e); box-shadow: 0 7px 18px rgba(255,71,126,.4), inset 0 -4px 0 rgba(0,0,0,.15);
    }
    .knap.blaa { background: linear-gradient(180deg, #4cc9f0, #3a6bff); box-shadow: 0 7px 18px rgba(58,107,255,.4), inset 0 -4px 0 rgba(0,0,0,.15); }
    .knap.hvid { background: #fff; color: #1b2440; box-shadow: 0 5px 14px rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.08); }
    .knap:active { transform: translateY(3px); }

    @media (max-width: 480px) {
      .rund { width: 46px; height: 46px; min-width: 46px; font-size: 22px; }
      .stjerner { font-size: 20px; padding: 6px 12px; }
      .sv-maerke { display: none; }
      .hud { gap: 6px; padding-left: 8px; padding-right: 8px; flex-wrap: wrap; }
      .hud .gruppe { gap: 6px; }
      .hud .stjerner { margin-left: auto; }
      .frem { order: 5; flex-basis: 100%; margin-top: 4px; }       /* på telefonen: Rasmus' vej på sin egen linje */
      .frem-bar { margin: 0 6px; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Menuen: vælg Rasmus og en bane -->
  <div class="menu" id="menu">
    <div class="menu-top">
      <a class="rund" href="../../" aria-label="Til forsiden">🏠</a>
      <h1 class="titel"><span>Rulle</span> <span style="animation-delay:-.8s">Rasmus</span></h1>
      <div class="plads"></div>
    </div>
    <div>
      <p class="henter" id="henter">Henter 3D …</p>
      <div class="panel">
        <div class="raekke-titel">Vælg Rasmus <em id="skinNavn"></em></div>
        <div class="skins" id="skins"></div>
        <div class="raekke-titel">Vælg bane <div class="svaerhed" id="svaerhed"></div></div>
        <div class="baner" id="baner"></div>
      </div>
    </div>
  </div>

  <!-- Øverst mens man spiller -->
  <div class="hud skjult" id="hud">
    <div class="gruppe">
      <a class="rund" href="../../" aria-label="Til forsiden">🏠</a>
      <button class="rund" id="kortKnap" aria-label="Vælg bane og farve">🗺️</button>
    </div>
    <div class="sv-maerke" id="hudSv" aria-label="Sværhedsgrad">🐢</div>
    <div class="frem">
      <div class="frem-bar" id="fremBar"><div class="frem-fyld" id="fremFyld"></div><div class="frem-rasmus" id="fremRasmus"></div></div>
      <span class="frem-maal">🏁</span>
    </div>
    <div class="stjerner" id="stjerner">⭐ <span id="stjerneTal">0</span></div>
    <div class="gruppe">
      <button class="rund" id="styreKnap" aria-label="Styring">📱</button>
      <button class="rund" id="musikKnap" aria-label="Musik">🎵</button>
    </div>
  </div>

  <div class="besked skjult" id="besked"></div>

  <div class="maal-kort skjult" id="maalKort">
    <h2 class="maal-titel">Rasmus kom i mål</h2>
    <div class="maal-stjerner" id="maalStjerner"></div>
    <div class="maal-tal" id="maalTal"></div>
    <div class="knapper">
      <button class="knap" id="naeste">▶ Næste bane</button>
      <button class="knap blaa" id="igen">🔁 Igen</button>
      <button class="knap hvid" id="tilBaner">🗺️ Baner</button>
    </div>
  </div>

  <script src="../../effekter.js"></script>
  <script>
    // Hvis 3D-motoren ikke kan hentes (fx ingen internet første gang), så sig det pænt
    setTimeout(function () {
      if (window.rasmusKlar) return;
      var h = document.getElementById("henter");
      h.textContent = "Kunne ikke hente 3D 😕 Tjek at der er internet, og tryk her for at prøve igen.";
      h.style.pointerEvents = "auto"; h.onclick = function () { location.reload(); };
    }, 15000);
  </script>
  <script type="module" src="spil.js"></script>
</body>
</html>
