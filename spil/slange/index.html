<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fjollet Slange 🐍</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: ui-rounded, "SF Pro Rounded", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #dff3ff; color: #1b4332;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .skjult { display: none !important; }

    /* Toppen: hjem, point og musik */
    .top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px; pointer-events: none;
    }
    .top > * { pointer-events: auto; }
    .rund {
      font-size: 26px; text-decoration: none; background: rgba(255,255,255,.92); border-radius: 50%;
      width: 52px; height: 52px; min-width: 52px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.2); border: none; padding: 0; cursor: pointer; color: inherit;
    }
    .rund:active { transform: scale(.92); }
    .taeller {
      font-size: 28px; font-weight: 900; background: rgba(255,255,255,.92); border-radius: 999px;
      padding: 8px 20px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
    }
    .taeller.hop { animation: hop .5s cubic-bezier(.2,1.6,.4,1); }
    @keyframes hop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

    /* Den magiske kraft, der er i gang lige nu — og hvor længe den varer */
    .kraft {
      position: fixed; top: 78px; left: 50%; transform: translateX(-50%); z-index: 9; pointer-events: none;
      display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 10px;
      background: rgba(255,255,255,.92); border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.2);
      font-size: 30px; animation: pust .6s ease-in-out infinite alternate;
    }
    @keyframes pust { to { transform: translateX(-50%) scale(1.07); } }
    .kraft .bar { width: min(180px, 40vw); height: 14px; border-radius: 7px; background: #e6e6e6; overflow: hidden; }
    .kraft .fyld { height: 100%; width: 100%; border-radius: 7px; background: linear-gradient(90deg, #ff477e, #ffd23f, #06d6a0, #3a86ff, #b15bff); }

    .besked {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 9;
      width: max-content; max-width: calc(100vw - 32px); text-align: center;
      font-size: clamp(18px, 3.4vw, 28px); font-weight: 900;
      background: rgba(255,255,255,.92); padding: 10px 22px; border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0,0,0,.18); pointer-events: none;
      animation: ind .45s cubic-bezier(.2,1.5,.4,1);
    }
    @keyframes ind { from { transform: translate(-50%, 160%); } to { transform: translate(-50%, 0); } }

    /* Hvidt glimt, når slangen rejser til en ny verden */
    #skift { position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: 0; transition: opacity .6s ease; background: radial-gradient(circle, #fff, #fff6d0); }
    #skift.vis { opacity: 1; transition: opacity .5s ease; }

    #indlaeser {
      position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
      background: radial-gradient(circle at 50% 40%, #d8f3dc, #95d5b2); font-size: 28px; font-weight: 900; transition: opacity .5s;
    }
    #indlaeser .slangen { font-size: 90px; animation: vrik 1s ease-in-out infinite alternate; }
    @keyframes vrik { from { transform: rotate(-12deg); } to { transform: rotate(12deg) scale(1.1); } }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="top">
    <a class="rund" href="../../" aria-label="Til forsiden">🏠</a>
    <div class="taeller" id="point">🍎 <span id="pointTal">0</span></div>
    <button class="rund" id="musikKnap" aria-label="Musik til og fra">🎵</button>
  </div>
  <div class="kraft skjult" id="kraft"><span id="kraftIkon">🚀</span><div class="bar"><div class="fyld" id="kraftFyld"></div></div></div>
  <div class="besked" id="besked">👆 Træk med fingeren — så følger slangen efter!</div>
  <div id="skift"></div>
  <div id="indlaeser"><div class="slangen">🐍</div><div>Fjollet Slange</div></div>

  <script src="../../effekter.js"></script>
  <script type="module">
    // Når 3D-spillet er klar, forsvinder indlæsningsbilledet (og hvis det ikke kan hentes, siger vi det pænt)
    import("./spil.js").then(() => {
      const el = document.getElementById("indlaeser");
      el.style.opacity = "0"; setTimeout(() => el.remove(), 500);
    }).catch(() => {
      document.getElementById("indlaeser").lastElementChild.textContent = "Slangen kunne ikke hentes — prøv igen, når der er internet 🙂";
    });
  </script>
</body>
</html>
