<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Byg en burger 🍔</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: ui-rounded, "SF Pro Rounded", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #ffd9a8;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    .top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; pointer-events: none;
    }
    .top > * { pointer-events: auto; }
    .rund {
      font-size: 26px; text-decoration: none; background: rgba(255,255,255,.92); border-radius: 50%;
      width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
    }
    .taeller {
      font-size: 26px; font-weight: 900; color: #5a2d0c; background: rgba(255,255,255,.92);
      border-radius: 999px; padding: 8px 18px; box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: nowrap;
    }
    .taeller.hop { animation: hop .5s cubic-bezier(.2,1.6,.4,1); }
    @keyframes hop { 40% { transform: scale(1.3); } }

    /* Bakken med ingredienser forneden: lækre ting øverst, sjove ting nederst */
    .bakke {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 7px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(255,255,255,.93), rgba(255,244,228,.97));
      border-radius: 26px 26px 0 0; box-shadow: 0 -6px 24px rgba(90,45,12,.18);
    }
    .ing {
      width: 60px; height: 60px; border-radius: 18px; border: none; padding: 0; cursor: pointer;
      background: #fff; box-shadow: 0 3px 0 #e8cfae, 0 4px 10px rgba(90,45,12,.15);
      display: flex; align-items: center; justify-content: center; font-size: 36px; line-height: 1;
      transition: transform .12s;
    }
    .ing canvas { width: 54px; height: 54px; pointer-events: none; }
    .ing:active { transform: translateY(3px) scale(.92); box-shadow: 0 0 0 #e8cfae; }
    .ing.sjov { background: #fff2fb; box-shadow: 0 3px 0 #f1cde6, 0 4px 10px rgba(90,45,12,.15); }
    .ing.kig { animation: kig 1s ease-in-out infinite; }
    @keyframes kig { 50% { transform: translateY(-8px) scale(1.1); } }
    .linjeskift { flex-basis: 100%; height: 0; }

    @media (max-width: 860px) {
      .bakke { gap: 6px; }
      .ing { width: 54px; height: 54px; }
      .ing canvas { width: 48px; height: 48px; }
    }
    @media (max-width: 520px), (max-height: 520px) {
      .ing { width: 48px; height: 48px; border-radius: 14px; font-size: 28px; }
      .ing canvas { width: 44px; height: 44px; }
      .bakke { gap: 5px; padding-top: 8px; }
      .rund { width: 44px; height: 44px; font-size: 22px; }
      .taeller { font-size: 20px; padding: 6px 14px; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="top">
    <a class="rund" href="../../">🏠</a>
    <div class="taeller" id="taeller">🍔 <span id="tal">0</span></div>
  </div>
  <div class="bakke" id="bakke"></div>

  <script src="../../effekter.js"></script>
  <script>
    // ===== Byg en burger =====
    // Tryk på ingredienserne, så dumper de ned på burgeren. Jo højere burgeren bliver, jo mere vakler den.
    // Træk så burgeren hen til den sultne mand (eller tryk på ham), så spiser han den.
    // Han bliver rød af chili, grøn af sokker og sko, og han fryser af is.

    const $ = id => document.getElementById(id);
    const klem = (v, a, b) => Math.max(a, Math.min(b, v));
    const tilf = (a, b) => a + Math.random() * (b - a);

    // ---------- Ingredienserne: h = tykkelse (i forhold til burgerens bredde) ----------
    const ING = {
      bolle:   { h: 0.2,  lyd: "puf",    tegn: tegnBolle },
      boef:    { h: 0.16, lyd: "syd",    tegn: tegnBøf },
      ost:     { h: 0.05, lyd: "plip",   tegn: tegnOst },
      salat:   { h: 0.08, lyd: "knas",   tegn: tegnSalat },
      tomat:   { h: 0.075,lyd: "klask",  tegn: tegnTomat },
      loeg:    { h: 0.06, lyd: "plip",   tegn: tegnLøg },
      agurk:   { h: 0.055,lyd: "plip",   tegn: tegnAgurk },
      bacon:   { h: 0.06, lyd: "syd",    tegn: tegnBacon },
      aeg:     { h: 0.09, lyd: "klask",  tegn: tegnÆg },
      ketchup: { h: 0.035,lyd: "sprøjt", tegn: (c, w, h) => tegnSovs(c, w, h, "#d8261c", "#ff6a55") },
      sennep:  { h: 0.035,lyd: "sprøjt", tegn: (c, w, h) => tegnSovs(c, w, h, "#e0a800", "#ffd84a") },
      top:     { h: 0.3,  lyd: "puf",    tegn: tegnTop },
      // de sjove ting — manden reagerer på dem
      chili:   { h: 0.2,  lyd: "boing", emoji: "🌶️", sjov: "chili" },
      is:      { h: 0.26, lyd: "boing", emoji: "🍦", sjov: "is" },
      fisk:    { h: 0.2,  lyd: "boing", emoji: "🐟", sjov: "fisk" },
      sok:     { h: 0.2,  lyd: "boing", emoji: "🧦", sjov: "bleh" },
      sko:     { h: 0.22, lyd: "boing", emoji: "👟", sjov: "bleh" },
      donut:   { h: 0.22, lyd: "boing", emoji: "🍩" },
    };
    const LÆKRE = ["boef", "ost", "salat", "tomat", "loeg", "agurk", "bacon", "aeg", "ketchup", "sennep", "bolle", "top"];
    const SJOVE = ["chili", "is", "fisk", "sok", "sko", "donut"];

    // Tilfældige tal, der altid bliver ens for samme lag (så salaten ikke blafrer, når den tegnes igen)
    function rng(frø) { let s = frø % 2147483646 + 1; return () => (s = s * 16807 % 2147483647) / 2147483647; }
    const BRUN = "#6b3a12";

    // ---------- Tegning af lagene. Hvert lag tegnes med bunden i y = 0 og midten i x = 0 ----------
    function tegnBolle(c, w, h) {                     // bund- eller mellembolle
      const g = c.createLinearGradient(0, -h, 0, 0);
      g.addColorStop(0, "#f7d9a0"); g.addColorStop(0.28, "#eaa24e"); g.addColorStop(1, "#b8692a");
      rundKasse(c, -w / 2, -h, w, h, h * 0.45); c.fillStyle = g; c.fill();
      c.lineWidth = w * 0.014; c.strokeStyle = BRUN; c.stroke();
      c.fillStyle = "rgba(255,245,215,.8)"; rundKasse(c, -w * 0.44, -h * 0.94, w * 0.88, h * 0.22, h * 0.1); c.fill();   // den skårne flade
    }
    function tegnTop(c, w, h, frø) {                  // topbollen med sesamfrø
      c.beginPath();
      c.moveTo(-w / 2, -h * 0.12);
      c.bezierCurveTo(-w / 2, -h * 1.05, w / 2, -h * 1.05, w / 2, -h * 0.12);
      c.quadraticCurveTo(w / 2, 0, w * 0.44, 0); c.lineTo(-w * 0.44, 0); c.quadraticCurveTo(-w / 2, 0, -w / 2, -h * 0.12);
      c.closePath();
      const g = c.createRadialGradient(-w * 0.15, -h * 0.75, h * 0.1, 0, -h * 0.3, w * 0.62);
      g.addColorStop(0, "#ffd88f"); g.addColorStop(0.5, "#eb9a42"); g.addColorStop(1, "#b0601f");
      c.fillStyle = g; c.fill();
      c.lineWidth = w * 0.014; c.strokeStyle = BRUN; c.stroke();
      c.fillStyle = "rgba(255,240,200,.55)";                                  // glans
      c.beginPath(); c.ellipse(-w * 0.16, -h * 0.66, w * 0.14, h * 0.1, -0.35, 0, Math.PI * 2); c.fill();
      const r = rng(frø || 7);                                                // sesamfrø
      c.fillStyle = "#fff8e6"; c.strokeStyle = "rgba(107,58,18,.35)"; c.lineWidth = w * 0.004;
      for (let i = 0; i < 13; i++) {
        const x = (r() - 0.5) * w * 0.78, top = -h * 0.12 - (h * 0.82) * Math.sqrt(1 - Math.pow(x / (w * 0.5), 2));
        const y = top + h * (0.08 + r() * 0.35);
        c.beginPath(); c.ellipse(x, y, w * 0.022, w * 0.011, r() * 3, 0, Math.PI * 2); c.fill(); c.stroke();
      }
    }
    function tegnBøf(c, w, h, frø) {
      const r = rng(frø || 3);
      c.beginPath();
      const n = 18;
      for (let i = 0; i <= n; i++) { const x = -w * 0.5 + w * i / n; c.lineTo(x, -h + (r() - 0.5) * h * 0.18); }   // knoldet overside
      c.quadraticCurveTo(w * 0.56, -h * 0.5, w * 0.5, 0);
      for (let i = n; i >= 0; i--) { const x = -w * 0.5 + w * i / n; c.lineTo(x, (r() - 0.5) * h * 0.14); }        // knoldet underside
      c.quadraticCurveTo(-w * 0.56, -h * 0.5, -w * 0.5, -h);
      c.closePath();
      const g = c.createLinearGradient(0, -h, 0, 0);
      g.addColorStop(0, "#8a4d27"); g.addColorStop(0.5, "#6a3518"); g.addColorStop(1, "#4a220d");
      c.fillStyle = g; c.fill();
      c.lineWidth = w * 0.012; c.strokeStyle = "#2e1405"; c.stroke();
      c.fillStyle = "rgba(255,190,140,.25)";                                   // små lyse prikker
      for (let i = 0; i < 16; i++) { c.beginPath(); c.arc((r() - 0.5) * w * 0.9, -h * (0.2 + r() * 0.6), w * 0.008, 0, Math.PI * 2); c.fill(); }
      c.strokeStyle = "rgba(255,220,180,.35)"; c.lineWidth = h * 0.08; c.lineCap = "round";     // saftig glans
      c.beginPath(); c.moveTo(-w * 0.34, -h * 0.78); c.lineTo(w * 0.1, -h * 0.82); c.stroke();
    }
    function tegnOst(c, w, h) {
      c.beginPath();                                                           // skiven med to dryp hen over kanten
      c.moveTo(-w * 0.53, -h); c.lineTo(w * 0.53, -h); c.lineTo(w * 0.53, 0);
      c.lineTo(w * 0.46, 0); c.lineTo(w * 0.4, h * 2.6); c.lineTo(w * 0.33, 0);
      c.lineTo(-w * 0.3, 0); c.lineTo(-w * 0.4, h * 3.2); c.lineTo(-w * 0.48, 0); c.lineTo(-w * 0.53, 0);
      c.closePath();
      c.fillStyle = "#ffc928"; c.fill();
      c.lineJoin = "round"; c.lineWidth = w * 0.01; c.strokeStyle = "#c98a00"; c.stroke();
      c.fillStyle = "rgba(255,255,255,.4)"; c.fillRect(-w * 0.5, -h * 0.9, w, h * 0.3);
    }
    function tegnSalat(c, w, h, frø) {
      const r = rng(frø || 5), n = 14, ud = w * 0.58;
      c.beginPath();
      c.moveTo(-ud, 0);
      for (let i = 0; i <= n; i++) { const x = -ud + 2 * ud * i / n; c.quadraticCurveTo(x - ud / n, -h * (1.3 + r() * 0.4), x, -h * (0.7 + r() * 0.3)); }
      for (let i = n; i >= 0; i--) { const x = -ud + 2 * ud * i / n; c.quadraticCurveTo(x + ud / n, h * (0.9 + r() * 0.6), x, h * 0.2); }
      c.closePath();
      const g = c.createLinearGradient(0, -h, 0, h);
      g.addColorStop(0, "#9be05a"); g.addColorStop(1, "#3f9f2a");
      c.fillStyle = g; c.fill();
      c.lineWidth = w * 0.01; c.strokeStyle = "#2c7a1c"; c.stroke();
      c.strokeStyle = "rgba(230,255,200,.6)"; c.lineWidth = w * 0.006;          // årer
      for (let i = 0; i < 6; i++) { const x = -ud * 0.8 + i * ud * 0.32; c.beginPath(); c.moveTo(x, h * 0.3); c.lineTo(x + w * 0.05, -h * 0.7); c.stroke(); }
    }
    function tegnTomat(c, w, h, frø) {
      rundKasse(c, -w * 0.48, -h, w * 0.96, h, h * 0.45);
      const g = c.createLinearGradient(0, -h, 0, 0);
      g.addColorStop(0, "#ff6a4d"); g.addColorStop(1, "#c41d10");
      c.fillStyle = g; c.fill();
      c.lineWidth = w * 0.01; c.strokeStyle = "#8a1208"; c.stroke();
      c.fillStyle = "#ff9d80"; rundKasse(c, -w * 0.4, -h * 0.66, w * 0.8, h * 0.32, h * 0.16); c.fill();   // det lyse indre
      const r = rng(frø || 9); c.fillStyle = "#ffe08a";
      for (let i = 0; i < 9; i++) { c.beginPath(); c.ellipse(-w * 0.36 + i * w * 0.09, -h * 0.5, w * 0.012, h * 0.1, r(), 0, Math.PI * 2); c.fill(); }
    }
    function tegnLøg(c, w, h) {
      c.lineWidth = h * 0.3;
      for (let i = 0; i < 4; i++) {
        const x = -w * 0.36 + i * w * 0.24;
        c.beginPath(); c.ellipse(x, -h * 0.5, w * 0.13, h * 0.45, 0, 0, Math.PI * 2);
        c.strokeStyle = "#b889d6"; c.stroke();
        c.lineWidth = h * 0.14; c.strokeStyle = "#f7ecff"; c.stroke(); c.lineWidth = h * 0.3;
      }
    }
    function tegnAgurk(c, w, h) {
      for (let i = 0; i < 3; i++) {
        const x = -w * 0.3 + i * w * 0.3;
        c.beginPath(); c.ellipse(x, -h * 0.5, w * 0.15, h * 0.6, 0, 0, Math.PI * 2);
        c.fillStyle = "#2f7d2f"; c.fill();
        c.beginPath(); c.ellipse(x, -h * 0.5, w * 0.12, h * 0.4, 0, 0, Math.PI * 2);
        c.fillStyle = "#c3e59a"; c.fill();
        c.fillStyle = "#e9f7d2";
        for (let j = -1; j <= 1; j++) { c.beginPath(); c.ellipse(x + j * w * 0.05, -h * 0.5, w * 0.012, h * 0.1, 0, 0, Math.PI * 2); c.fill(); }
      }
    }
    function tegnBacon(c, w, h) {
      const bølge = x => Math.sin(x / w * 16) * h * 0.45;
      c.beginPath();
      for (let x = -w * 0.55; x <= w * 0.55; x += w / 40) c.lineTo(x, -h + bølge(x));
      for (let x = w * 0.55; x >= -w * 0.55; x -= w / 40) c.lineTo(x, bølge(x));
      c.closePath();
      c.fillStyle = "#b8392a"; c.fill();
      c.lineWidth = w * 0.009; c.strokeStyle = "#6e1a10"; c.stroke();
      c.strokeStyle = "#f7c3b0"; c.lineWidth = h * 0.2;                        // fedtstriber
      c.beginPath();
      for (let x = -w * 0.53; x <= w * 0.53; x += w / 40) c.lineTo(x, -h * 0.5 + bølge(x));
      c.stroke();
    }
    function tegnÆg(c, w, h, frø) {
      const r = rng(frø || 11);
      c.beginPath();                                                           // hviden med bølget kant
      const n = 16;
      for (let i = 0; i <= n; i++) { const a = Math.PI + Math.PI * i / n; c.lineTo(Math.cos(a) * w * (0.52 + r() * 0.06), -h * 0.45 + Math.sin(a) * h * 0.18); }
      c.lineTo(w * 0.55, 0); c.lineTo(-w * 0.55, 0); c.closePath();
      c.fillStyle = "#ffffff"; c.fill();
      c.lineWidth = w * 0.008; c.strokeStyle = "#d9d2c4"; c.stroke();
      const g = c.createRadialGradient(-w * 0.04, -h * 0.9, h * 0.05, 0, -h * 0.6, w * 0.16);   // blommen
      g.addColorStop(0, "#fff0a0"); g.addColorStop(0.5, "#ffb300"); g.addColorStop(1, "#f08a00");
      c.beginPath(); c.ellipse(w * 0.05, -h * 0.55, w * 0.15, h * 0.48, 0, Math.PI, 0); c.closePath();
      c.fillStyle = g; c.fill();
    }
    function tegnSovs(c, w, h, mørk, lys) {          // ketchup/sennep: en bølget stribe med runde dryp ud over kanten
      c.beginPath();
      c.moveTo(-w * 0.5, 0);
      for (let i = 0; i <= 10; i++) c.lineTo(-w * 0.5 + w * i / 10, -h - Math.sin(i * 2.1) * h * 0.4);
      c.lineTo(w * 0.5, 0); c.closePath();
      c.fillStyle = mørk; c.fill();
      for (const [x, l] of [[0.46, 2.6], [0.18, 1.4], [-0.16, 2], [-0.45, 3]]) {   // dryp med en dråbe forneden
        c.beginPath(); c.moveTo(w * (x - 0.03), -h * 0.2);
        c.quadraticCurveTo(w * (x - 0.02), h * l * 0.6, w * (x - 0.035), h * l);
        c.arc(w * x, h * l, w * 0.035, Math.PI, 0, true);
        c.quadraticCurveTo(w * (x + 0.02), h * l * 0.6, w * (x + 0.03), -h * 0.2); c.closePath();
        c.fill();
      }
      c.strokeStyle = lys; c.lineWidth = h * 0.3; c.lineCap = "round";
      c.beginPath(); c.moveTo(-w * 0.4, -h * 0.9); c.lineTo(w * 0.3, -h * 1.1); c.stroke();
    }
    function tegnEmoji(c, w, h, emoji) {             // de sjove ting ligger ned på burgeren
      c.save(); c.translate(0, -h * 0.5); c.rotate(-0.12);
      c.font = `${Math.round(h * 1.6)}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
      c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText(emoji, 0, h * 0.08);
      c.restore();
    }
    function tegnLag(c, type, w, h, frø) {
      const d = ING[type];
      if (d.emoji) tegnEmoji(c, w, h, d.emoji); else d.tegn(c, w, h, frø);
    }
    function rundKasse(c, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      c.beginPath(); c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
    }

    // ---------- Lyd (Web Audio, ingen lydfiler) ----------
    let ac = null, ud = null, støj = null;
    function lydKlar() {
      try {
        ac = Effekter.audio();
        if (!ud) {
          ud = ac.createGain(); ud.gain.value = 0.9; ud.connect(ac.destination);
          støj = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
          const d = støj.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
      } catch (_) {}
    }
    const nu = () => ac ? ac.currentTime : 0;
    function tone(f, start, dur, type, vol, slut, vib) {
      if (!ud) return;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(f, start);
      if (slut) o.frequency.exponentialRampToValueAtTime(slut, start + dur);
      if (vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = vib[0]; lg.gain.value = vib[1]; l.connect(lg); lg.connect(o.frequency); l.start(start); l.stop(start + dur + 0.05); }
      o.connect(g); g.connect(ud);
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, start + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.start(start); o.stop(start + dur + 0.05);
    }
    function sus(start, dur, type, fra, til, vol, q) {
      if (!ud) return;
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = støj; f.type = type; f.Q.value = q || 1;
      f.frequency.setValueAtTime(fra, start); f.frequency.exponentialRampToValueAtTime(til, start + dur);
      g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      s.connect(f); f.connect(g); g.connect(ud);
      s.start(start, Math.random() * 0.5, dur + 0.05);
    }
    const LYDE = {
      puf:    () => { tone(180, nu(), 0.18, "sine", 0.35, 90); sus(nu(), 0.12, "lowpass", 900, 200, 0.2); },
      syd:    () => { sus(nu(), 0.45, "highpass", 3000, 5000, 0.12); tone(140, nu(), 0.12, "sine", 0.25, 80); },
      plip:   () => tone(tilf(700, 900), nu(), 0.12, "sine", 0.25, 1300),
      knas:   () => { for (let i = 0; i < 4; i++) sus(nu() + i * 0.035, 0.04, "bandpass", 2500, 1800, 0.25, 2); },
      klask:  () => { sus(nu(), 0.16, "lowpass", 1400, 200, 0.4); tone(220, nu(), 0.12, "sine", 0.2, 110); },
      sprøjt: () => sus(nu(), 0.3, "bandpass", 600, 2400, 0.3, 3),
      boing:  () => tone(160, nu(), 0.35, "sine", 0.3, 520, [18, 30]),
    };
    function tyg() { for (let i = 0; i < 12; i++) sus(nu() + i * 0.19, 0.09, "lowpass", 900, 300, 0.3); }
    function synk() { tone(420, nu(), 0.28, "sine", 0.4, 110); }
    function mmm() { tone(196, nu(), 0.9, "triangle", 0.22, 247, [5, 6]); tone(392, nu(), 0.9, "sine", 0.06, 494); }
    function bøvs() { sus(nu(), 0.7, "lowpass", 420, 160, 0.55, 4); tone(78, nu(), 0.7, "sawtooth", 0.18, 60, [22, 12]); }
    function fløjt() { tone(900, nu(), 1.4, "sine", 0.14, 2400); sus(nu() + 0.2, 1.2, "highpass", 4000, 6000, 0.1); }
    function bleh() { tone(140, nu(), 0.7, "sawtooth", 0.15, 110, [28, 40]); }
    function brr() { for (let i = 0; i < 18; i++) tone(tilf(1800, 2400), nu() + i * 0.05, 0.03, "square", 0.05); }
    function blub() { for (let i = 0; i < 5; i++) tone(tilf(300, 500), nu() + i * 0.14, 0.12, "sine", 0.25, tilf(800, 1100)); }
    function hm() { tone(260, nu(), 0.35, "triangle", 0.18, 340); }
    function smask() { sus(nu(), 0.06, "bandpass", 1800, 1200, 0.2, 3); }
    function ding() { tone(1047, nu(), 0.4, "sine", 0.2); tone(1568, nu() + 0.08, 0.5, "sine", 0.14); }
    function væk() { sus(nu(), 0.5, "bandpass", 300, 2000, 0.3, 1.5); }

    // ---------- Skærm og opstilling ----------
    const cv = $("scene"), ctx = cv.getContext("2d"), bakkeEl = $("bakke");
    const bg = document.createElement("canvas"), disk = document.createElement("canvas");
    let W = 0, H = 0, dpr = 1, liggende = true, bredde = 200, diskY = 0;
    const tallerken = { x: 0, y: 0 }, mand = { x: 0, y: 0, r: 100 };

    function layout() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = cv.clientWidth || window.innerWidth; H = cv.clientHeight || window.innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      const bakkeH = bakkeEl.getBoundingClientRect().height;
      liggende = W > H * 0.95;
      const fri = H - bakkeH;                                  // fladen over bakken
      if (liggende) {
        mand.r = Math.min(W * 0.16, fri * 0.3);
        mand.x = W * 0.75; mand.y = Math.max(mand.r + 40, fri * 0.42);
        bredde = Math.min(W * 0.26, fri * 0.42);
        tallerken.x = W * 0.34;
      } else {
        mand.r = Math.min(W * 0.24, fri * 0.17);
        mand.x = W * 0.5; mand.y = mand.r + 74;
        bredde = Math.min(W * 0.5, fri * 0.3);
        tallerken.x = W * 0.5;
      }
      tallerken.y = fri - bredde * 0.16;
      diskY = tallerken.y + bredde * 0.05;
      tegnBaggrund(); tegnDisk();
    }

    // Væggen i burgerbaren: varme farver, fliser og billeder af mad i rammer
    function tegnBaggrund() {
      bg.width = cv.width; bg.height = cv.height;
      const b = bg.getContext("2d");
      b.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = b.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#ffe7c2"); g.addColorStop(1, "#ffc99a");
      b.fillStyle = g; b.fillRect(0, 0, W, H);
      const f = Math.max(40, Math.min(W, H) / 12);             // skakternede fliser nederst på væggen
      for (let y = diskY - f * 3; y < diskY; y += f) for (let x = 0, i = 0; x < W; x += f, i++)
        if ((Math.floor(x / f) + Math.floor((y - diskY) / f)) % 2 === 0) { b.fillStyle = "rgba(230,90,70,.16)"; b.fillRect(x, y, f, f); }
      b.fillStyle = "#e85d4a"; b.fillRect(0, diskY - f * 3 - 8, W, 8);
      // billeder i rammer
      const billeder = ["🍔", "🍟", "🥤", "🌭", "🍦"];
      const n = liggende ? 4 : 3, rs = Math.min(W, H) * 0.075;
      for (let i = 0; i < n; i++) {
        const x = liggende ? W * (0.08 + i * 0.12) : W * (0.14 + i * 0.36), y = liggende ? H * 0.2 : mand.y + mand.r * 2.1;
        if (!liggende && i === 1) continue;
        b.save(); b.translate(x, y); b.rotate((i % 2 ? 1 : -1) * 0.06);
        b.fillStyle = "rgba(0,0,0,.12)"; b.fillRect(-rs + 4, -rs + 6, rs * 2, rs * 2);
        b.fillStyle = "#8a5a2b"; b.fillRect(-rs, -rs, rs * 2, rs * 2);
        b.fillStyle = "#fff8ec"; b.fillRect(-rs * 0.82, -rs * 0.82, rs * 1.64, rs * 1.64);
        b.font = `${Math.round(rs * 1.1)}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
        b.textAlign = "center"; b.textBaseline = "middle"; b.fillText(billeder[i % billeder.length], 0, rs * 0.06);
        b.restore();
      }
    }
    // Disken af træ, som tallerkenen står på (den tegnes foran mandens krop)
    function tegnDisk() {
      disk.width = cv.width; disk.height = cv.height;
      const d = disk.getContext("2d");
      d.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = d.createLinearGradient(0, diskY, 0, H);
      g.addColorStop(0, "#c98a4b"); g.addColorStop(0.08, "#b0703a"); g.addColorStop(1, "#7d4a22");
      d.fillStyle = g; d.fillRect(0, diskY, W, H - diskY);
      d.fillStyle = "rgba(255,230,190,.45)"; d.fillRect(0, diskY, W, 3);
      d.strokeStyle = "rgba(80,40,10,.18)"; d.lineWidth = 2;
      for (let y = diskY + 18; y < H; y += 22) { d.beginPath(); d.moveTo(0, y); d.bezierCurveTo(W * 0.3, y + 6, W * 0.6, y - 6, W, y + 3); d.stroke(); }
    }

    // ---------- Burgeren ----------
    let lag = [];                // nedefra: { type, dx, rot, op (højde over tallerkenen), vop, ligger, klem, frø }
    let sving = 0, svingV = 0, zoom = 1;
    const lagH = type => ING[type].h * bredde;
    function nytLag(type) {
      const mål = lag.reduce((s, l) => s + lagH(l.type), 0);
      lag.push({ type, dx: tilf(-0.04, 0.04) * bredde, rot: tilf(-0.04, 0.04), op: mål + H * 1.1 / zoom, vop: 0, ligger: false, klem: 0,
        frø: Math.floor(Math.random() * 1e6), mål });
    }
    function nyBurger() {
      lag = []; sving = svingV = 0;
      nytLag("bolle");
      const b = lag[0]; b.op = 0; b.ligger = true; b.dx = 0; b.rot = 0;
    }
    const burgerHøjde = () => lag.reduce((s, l) => s + lagH(l.type), 0);
    const harTop = () => lag.some(l => l.type === "top");

    function opdaterBurger(dt) {
      const h = burgerHøjde();
      // lagene falder ned og lander med et lille klem
      for (const l of lag) {
        l.klem = Math.max(0, l.klem - dt * 4);
        if (l.ligger) continue;
        l.vop -= 3200 * dt;
        l.op += l.vop * dt;
        if (l.op <= l.mål) {
          l.op = l.mål; l.ligger = true; l.klem = 1;
          svingV += (Math.random() < 0.5 ? -1 : 1) * (0.12 + h / bredde * 0.06);
          LYDE[ING[l.type].lyd]();
          krummer(l);
          landet(l);
        }
      }
      // hele burgeren vakler som gele — mere jo højere den er
      const stiv = 38 / (1 + h / bredde * 0.8);
      svingV += (-stiv * sving - 3.2 * svingV) * dt;
      sving = klem(sving + svingV * dt, -0.35, 0.35);
      // zoom ud, når burgeren bliver for høj til skærmen
      const top = liggende ? 86 : mand.y + mand.r * 1.25;
      const plads = Math.max(80, tallerken.y - top);
      zoom += (Math.min(1, plads / (h + bredde * 0.25)) - zoom) * Math.min(1, dt * 4);
    }

    // Hvor er burgerens bund lige nu (på tallerkenen, i fingeren eller på vej ind i munden)?
    let pos = { x: 0, y: 0 }, skala = 1;
    function tegnBurger() {
      const h = burgerHøjde();
      ctx.save();
      ctx.translate(pos.x, pos.y); ctx.scale(skala, skala);
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      for (const l of lag) {
        const hh = lagH(l.type), sq = 1 - Math.sin(l.klem * Math.PI) * 0.25;
        const skæv = sving * l.op * (1 + l.op / (bredde * 3));   // de øverste lag svajer mest
        ctx.save();
        ctx.translate(l.dx + skæv, -l.op);
        ctx.rotate(l.rot + sving * 0.5 * (l.op / Math.max(h, 1)));
        ctx.scale(1 + (1 - sq) * 0.6, sq);
        tegnLag(ctx, l.type, bredde, hh, l.frø);
        ctx.restore();
      }
      // en lille dannebrogsflag-tandstik i toppen, når burgeren har låg på
      const t = lag.find(l => l.type === "top");
      if (t && t.ligger) {
        const topOp = t.op + lagH("top") * 0.9, x = t.dx + sving * topOp * 1.2;
        ctx.strokeStyle = "#d9b98a"; ctx.lineWidth = bredde * 0.015;
        ctx.beginPath(); ctx.moveTo(x, -t.op - lagH("top") * 0.5); ctx.lineTo(x + sving * 40, -topOp - bredde * 0.18); ctx.stroke();
        const fx = x + sving * 40, fy = -topOp - bredde * 0.18, fb = bredde * 0.16, fh = bredde * 0.11;
        ctx.fillStyle = "#c8102e"; ctx.fillRect(fx, fy, fb, fh);
        ctx.fillStyle = "#fff"; ctx.fillRect(fx + fb * 0.3, fy, fb * 0.13, fh); ctx.fillRect(fx, fy + fh * 0.43, fb, fh * 0.16);
      }
      ctx.restore();
    }
    function tegnTallerken() {
      const x = tallerken.x, y = tallerken.y, rx = bredde * 0.72, ry = bredde * 0.1;
      ctx.fillStyle = "rgba(90,45,12,.2)";
      ctx.beginPath(); ctx.ellipse(x, y + ry * 0.7, rx * 1.02, ry * 1.1, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#d8dde6"; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = "#8ecae6"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(x, y, rx * 0.86, ry * 0.8, 0, 0, Math.PI * 2); ctx.stroke();
    }

    // ---------- Manden ----------
    const m = { åben: 0, åbenMål: 0, blink: 0, blinkTid: 2, kigX: 0, kigY: 0, pust: 0, tint: "", tintA: 0, tintMål: 0,
      glad: 0, bryn: 0, ryst: 0, hop: 0, savl: 0, tunge: 0, mave: 0 };
    let tygger = false;

    function opdaterMand(dt, t) {
      // blink af og til
      m.blinkTid -= dt;
      if (m.blinkTid <= 0) { m.blink = 1; m.blinkTid = tilf(2.5, 5); }
      m.blink = Math.max(0, m.blink - dt * 7);
      // kig på burgeren
      const top = { x: pos.x, y: pos.y - burgerHøjde() * skala * 0.6 };
      const dx = top.x - mand.x, dy = top.y - mand.y, d = Math.hypot(dx, dy) || 1;
      m.kigX += (dx / d - m.kigX) * Math.min(1, dt * 6); m.kigY += (dy / d - m.kigY) * Math.min(1, dt * 6);
      // munden: tygger, åbner sig for burgeren, eller smiler
      if (tygger) m.åben = 0.12 + Math.abs(Math.sin(t * 9)) * 0.3;
      else m.åben += (m.åbenMål - m.åben) * Math.min(1, dt * 10);
      m.tintA += (m.tintMål - m.tintA) * Math.min(1, dt * 2.5);
      m.ryst = Math.max(0, m.ryst - dt * 0.6);
      m.hop = Math.max(0, m.hop - dt * 1.5);
      m.bryn = Math.max(0, m.bryn - dt * 0.8);
      m.savl = harTop() && tilstand === "bygger" ? Math.min(1, m.savl + dt) : Math.max(0, m.savl - dt * 2);
      m.mave = Math.max(0, m.mave - dt * 0.05);
    }

    function tegnMand(t) {
      const r = mand.r, ry = m.ryst ? Math.sin(t * 60) * r * 0.025 * m.ryst : 0;
      const x = mand.x + ry, y = mand.y - Math.abs(Math.sin(t * 10)) * r * 0.05 * m.hop;
      // kroppen med stribet skjorte og en serviet
      const kropB = r * (1.55 + m.mave * 0.25), kropTop = y + r * 0.72;
      ctx.save();
      rundKasse(ctx, x - kropB, kropTop, kropB * 2, r * 3, r * 0.7);
      ctx.fillStyle = "#3d8bd9"; ctx.fill();
      ctx.clip();
      ctx.fillStyle = "rgba(255,255,255,.28)";
      for (let i = -6; i <= 6; i++) ctx.fillRect(x + i * r * 0.26 - r * 0.05, kropTop, r * 0.1, r * 3);
      ctx.restore();
      ctx.beginPath(); ctx.moveTo(x - r * 0.62, kropTop + r * 0.02); ctx.lineTo(x + r * 0.62, kropTop + r * 0.02); ctx.lineTo(x, kropTop + r * 1.15); ctx.closePath();
      ctx.fillStyle = "#ffffff"; ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = "rgba(232,70,60,.55)";                                   // ternet serviet
      for (let i = -4; i < 5; i++) for (let j = 0; j < 6; j++) if ((i + j) % 2 === 0) ctx.fillRect(x + i * r * 0.16, kropTop + j * r * 0.16, r * 0.16, r * 0.16);
      ctx.restore();
      // ører
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(x + s * r * 0.96, y + r * 0.05, r * 0.2, r * 0.26, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#f4b78f"; ctx.fill();
        if (m.tintA > 0.01) { ctx.globalAlpha = m.tintA * 0.55; ctx.fillStyle = m.tint; ctx.fill(); ctx.globalAlpha = 1; }
      }
      // hovedet
      const hg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r * 1.05);
      hg.addColorStop(0, "#ffe2c8"); hg.addColorStop(1, "#f2b08a");
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      if (m.tintA > 0.01) {                                                    // rød, grøn eller blå i hovedet
        ctx.globalAlpha = m.tintA * 0.55; ctx.fillStyle = m.tint;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      }
      // hår: nogle krøller på toppen
      ctx.fillStyle = "#6b3f1d";
      for (let i = 0; i < 7; i++) { const a = Math.PI * (1.18 + i * 0.105); ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * 0.9, y + Math.sin(a) * r * 0.9, r * 0.2, 0, Math.PI * 2); ctx.fill(); }
      // øjne der kigger efter burgeren (eller er hjerter, når han er glad)
      const løft = r * (0.06 * m.åben + 0.1 * m.bryn);
      for (const s of [-1, 1]) {
        const ex = x + s * r * 0.35, ey = y - r * 0.2;
        ctx.strokeStyle = "#5a3212"; ctx.lineWidth = r * 0.07; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(ex, ey - r * 0.12 - løft - (s > 0 ? r * 0.05 * m.bryn : 0), r * 0.2, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke();
        if (m.glad > 0.5) { ctx.fillStyle = "#ff3b6b"; hjerte(ex, ey, r * 0.2 * (1 + Math.sin(t * 8) * 0.1)); continue; }
        const åbn = 1 - m.blink;
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.19, r * 0.23 * Math.max(0.08, åbn), 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "rgba(90,50,18,.4)"; ctx.lineWidth = r * 0.02; ctx.stroke();
        if (åbn > 0.3) {
          const px = ex + m.kigX * r * 0.07, py = ey + m.kigY * r * 0.08;
          ctx.fillStyle = "#2a1a0e"; ctx.beginPath(); ctx.arc(px, py, r * 0.1, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(px - r * 0.035, py - r * 0.04, r * 0.035, 0, Math.PI * 2); ctx.fill();
        }
      }
      // kinder — de puster sig op, når han tygger
      const kind = r * (0.15 + (tygger ? 0.1 + Math.abs(Math.sin(t * 9)) * 0.06 : 0));
      ctx.fillStyle = "rgba(255,120,120,.45)";
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * r * 0.58, y + r * 0.32, kind, 0, Math.PI * 2); ctx.fill(); }
      // munden
      tegnMund(x, y + r * 0.56 + m.åben * r * 0.1, r);
      // næse og overskæg
      ctx.fillStyle = "#e8957a"; ctx.beginPath(); ctx.ellipse(x, y + r * 0.1, r * 0.17, r * 0.14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.beginPath(); ctx.arc(x - r * 0.06, y + r * 0.05, r * 0.04, 0, Math.PI * 2); ctx.fill();
      const skæg = y + r * 0.3 - m.åben * r * 0.05;
      ctx.fillStyle = "#6b3f1d";
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(x + s * r * 0.19, skæg, r * 0.22, r * 0.1, s * 0.25, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + s * r * 0.4, skæg - r * 0.05, r * 0.08, r * 0.05, -s * 0.6, 0, Math.PI * 2); ctx.fill();
      }
      // savl, når der er en færdig burger foran ham
      if (m.savl > 0.05 && m.åben < 0.3) {
        const sx = x + r * 0.26, sy = y + r * 0.62, l = r * 0.12 * m.savl * (1 + Math.sin(t * 3) * 0.2);
        ctx.fillStyle = "rgba(150,210,255,.9)"; ctx.beginPath(); ctx.ellipse(sx, sy + l, r * 0.035, l, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    function tegnMund(x, y, r) {
      const b = r * (0.28 + m.åben * 0.14), h = r * (0.03 + m.åben * 0.32);
      if (m.åben < 0.06) {                                                     // et smil
        ctx.strokeStyle = "#7a1c22"; ctx.lineWidth = r * 0.06; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(x, y - r * 0.12, r * 0.24, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
        return;
      }
      ctx.save();
      ctx.beginPath(); ctx.ellipse(x, y, b, h, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#5a0f18"; ctx.fill();
      ctx.clip();
      ctx.fillStyle = "#fff"; ctx.fillRect(x - b, y - h, b * 2, h * 0.28);          // tænder
      ctx.fillStyle = "#ff7d8e"; ctx.beginPath(); ctx.ellipse(x, y + h * 0.75, b * 0.6, h * 0.5, 0, 0, Math.PI * 2); ctx.fill();   // tunge
      ctx.restore();
      ctx.strokeStyle = "#a33a3f"; ctx.lineWidth = r * 0.04;
      ctx.beginPath(); ctx.ellipse(x, y, b, h, 0, 0, Math.PI * 2); ctx.stroke();
      if (m.tunge > 0.05) {                                                    // bleh: tungen ud
        ctx.fillStyle = "#ff6f84"; ctx.beginPath(); ctx.ellipse(x + r * 0.05, y + h + r * 0.12 * m.tunge, r * 0.13, r * 0.16 * m.tunge, 0.2, 0, Math.PI * 2); ctx.fill();
      }
    }
    function hjerte(x, y, s) {
      ctx.beginPath();
      ctx.moveTo(x, y + s * 0.8);
      ctx.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.6, y - s * 1.3, x, y - s * 0.45);
      ctx.bezierCurveTo(x + s * 0.6, y - s * 1.3, x + s * 1.6, y - s * 0.2, x, y + s * 0.8);
      ctx.fill();
    }
    // Hænderne med kniv og gaffel står foran disken
    function tegnHænder(t) {
      const r = mand.r, spring = Math.abs(Math.sin(t * 8)) * r * 0.12 * Math.max(m.hop, m.savl * 0.5);
      for (const s of [-1, 1]) {
        const hx = mand.x + s * r * 1.35, hy = (liggende ? diskY : mand.y + r * 1.9) - r * 0.12 - spring;
        ctx.fillStyle = "#b9c2cf"; ctx.strokeStyle = "#6c7684"; ctx.lineWidth = r * 0.02;
        rundKasse(ctx, hx - r * 0.045, hy - r * 0.95, r * 0.09, r * 0.8, r * 0.04); ctx.fill(); ctx.stroke();
        if (s < 0) for (let i = -1.5; i <= 1.5; i++) { rundKasse(ctx, hx + i * r * 0.05 - r * 0.015, hy - r * 1.25, r * 0.03, r * 0.35, r * 0.015); ctx.fill(); }   // gaffel
        else { ctx.beginPath(); ctx.moveTo(hx - r * 0.06, hy - r * 0.9); ctx.quadraticCurveTo(hx + r * 0.12, hy - r * 1.2, hx - r * 0.02, hy - r * 1.35); ctx.lineTo(hx - r * 0.06, hy - r * 0.9); ctx.fill(); ctx.stroke(); }   // kniv
        const g = ctx.createRadialGradient(hx - r * 0.08, hy - r * 0.08, r * 0.05, hx, hy, r * 0.3);
        g.addColorStop(0, "#ffe2c8"); g.addColorStop(1, "#eba57e");
        ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(hx, hy, r * 0.26, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    const mund = () => ({ x: mand.x, y: mand.y + mand.r * 0.56 });

    // ---------- Partikler: krummer, damp, hjerter, sne og bobler ----------
    let partikler = [];
    function krummer(l) {
      const x = pos.x + l.dx * skala, y = pos.y - l.op * skala;
      const farve = { boef: "#6a3518", salat: "#6fcf3a", tomat: "#e03a26", ost: "#ffc928", bolle: "#e7a04c", top: "#f0c070",
        ketchup: "#d8261c", sennep: "#e0a800", bacon: "#b8392a", aeg: "#ffffff", loeg: "#f7ecff", agurk: "#5fae3f" }[l.type] || "#ffffff";
      for (let i = 0; i < 10; i++) partikler.push({ type: "prik", x: x + tilf(-0.4, 0.4) * bredde * skala, y, vx: tilf(-160, 160), vy: tilf(-260, -60),
        g: 900, r: tilf(2, 5), farve, liv: tilf(0.4, 0.8) });
    }
    function opdaterPartikler(dt) {
      for (const p of partikler) { p.liv -= dt; p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.vokser) p.r += p.vokser * dt; }
      partikler = partikler.filter(p => p.liv > 0);
    }
    function tegnPartikler() {
      for (const p of partikler) {
        ctx.globalAlpha = klem(p.liv * 2, 0, 1);
        if (p.type === "hjerte") { ctx.fillStyle = p.farve; hjerte(p.x, p.y, p.r); }
        else if (p.type === "damp") { ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
        else if (p.type === "boble") { ctx.strokeStyle = "rgba(120,200,255,.9)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke(); }
        else if (p.type === "lag") {                                          // et lag, der flyver af (skraldespanden)
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot += p.vr / 60); ctx.scale(skala, skala);
          tegnLag(ctx, p.lagType, bredde, lagH(p.lagType), p.frø); ctx.restore();
        } else { ctx.fillStyle = p.farve; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
    }

    // ---------- Tilstande: bygger · trækker · tilbage · flyver · tygger · reagerer · ny ----------
    let tilstand = "bygger", tTid = 0, fra = null, inaktiv = 0, spist = [], antalSpist = 0, reaktion = "", trukket = null;
    function sæt(t) { tilstand = t; tTid = 0; }

    // Et lag er landet: manden reagerer lidt
    function landet(l) {
      if (tilstand !== "bygger") return;
      if (ING[l.type].sjov) { m.bryn = 1; hm(); }
      else if (l.type === "top") { m.hop = 1; mmm(); }
      else if (Math.random() < 0.4) { m.åben = 0.25; smask(); }
    }

    function læg(type) {
      if (tilstand !== "bygger" && tilstand !== "trækker") return;
      lydKlar(); inaktiv = 0;
      if (lag.length > 60) return;
      nytLag(type);
    }
    function skraldespand() {
      if (tilstand !== "bygger" || lag.length < 2) return;
      lydKlar(); inaktiv = 0; væk();
      for (const l of lag.slice(1)) partikler.push({ type: "lag", lagType: l.type, frø: l.frø, x: pos.x + l.dx * skala, y: pos.y - l.op * skala,
        vx: tilf(-500, 500), vy: tilf(-700, -300), g: 1600, rot: 0, vr: tilf(-8, 8), liv: 1.4 });
      nyBurger();
    }

    function spis() {                               // burgeren flyver ind i munden
      if (lag.length < 2) return;
      fra = { x: pos.x, y: pos.y, s: skala };
      sæt("flyver"); m.åbenMål = 1.4;
    }
    function efterSpisning() {                      // hvad sker der med manden?
      const har = s => spist.some(t => ING[t].sjov === s);
      reaktion = har("chili") ? "chili" : har("bleh") ? "bleh" : har("is") ? "is" : har("fisk") ? "fisk" : "glad";
      const r = mand.r;
      if (reaktion === "chili") { m.tint = "#ff2a00"; m.tintMål = 1; fløjt(); }
      else if (reaktion === "bleh") { m.tint = "#3fbf3f"; m.tintMål = 1; m.tunge = 1; bleh(); }
      else if (reaktion === "is") { m.tint = "#5fb8ff"; m.tintMål = 1; m.ryst = 1; brr(); }
      else if (reaktion === "fisk") { blub(); for (let i = 0; i < 10; i++) partikler.push({ type: "boble", x: mand.x + tilf(-r, r) * 0.3, y: mund().y, vx: tilf(-40, 40), vy: tilf(-160, -80), r: tilf(6, 14), liv: tilf(1, 1.8) }); }
      else { m.glad = 1; mmm(); m.hop = 1; Effekter.stjerner(mand.x, mand.y - r * 0.4, { antal: 12 }); }
      for (let i = 0; i < (reaktion === "glad" ? 8 : 0); i++) partikler.push({ type: "hjerte", x: mand.x + tilf(-1, 1) * r, y: mand.y - r * 0.8, vx: tilf(-30, 30), vy: tilf(-120, -60), r: tilf(8, 14), farve: "#ff3b6b", liv: tilf(1.2, 2) });
    }

    function opdater(dt, t) {
      tTid += dt; inaktiv += dt;
      opdaterBurger(dt);
      const M = mund(), r = mand.r, h = burgerHøjde();
      switch (tilstand) {
        case "bygger":
          pos.x += (tallerken.x - pos.x) * Math.min(1, dt * 10); pos.y += (tallerken.y - pos.y) * Math.min(1, dt * 10);
          skala = zoom; m.åbenMål = 0;
          break;
        case "trækker": {                             // munden åbner sig, når burgeren kommer tæt på
          skala = zoom;
          const d = Math.hypot(pos.x - M.x, pos.y - h * skala * 0.5 - M.y);
          m.åbenMål = klem(1.5 - d / (r * 2.5), 0.1, 1.4);
          break;
        }
        case "tilbage":
          pos.x += (tallerken.x - pos.x) * Math.min(1, dt * 9); pos.y += (tallerken.y - pos.y) * Math.min(1, dt * 9);
          m.åbenMål = 0;
          if (tTid > 0.4) sæt("bygger");
          break;
        case "flyver": {                              // i en bue op og ind i munden, mens den bliver lille
          const p = Math.min(1, tTid / 0.7), e = p * p * (3 - 2 * p);
          const passer = Math.min(fra.s, r * 0.85 / Math.max(bredde, h));
          skala = fra.s + (passer - fra.s) * e;
          const mx = M.x, my = M.y + h * skala * 0.5, top = Math.min(fra.y, my) - r * 1.2;
          pos.x = (1 - e) * (1 - e) * fra.x + 2 * (1 - e) * e * (fra.x + mx) / 2 + e * e * mx;
          pos.y = (1 - e) * (1 - e) * fra.y + 2 * (1 - e) * e * top + e * e * my;
          if (p >= 1) {
            spist = lag.map(l => l.type); lag = [];
            sæt("tygger"); tygger = true; m.åbenMål = 0; tyg();
            m.hop = 0.6;
          }
          break;
        }
        case "tygger":
          if (Math.random() < dt * 14) partikler.push({ type: "prik", x: M.x + tilf(-r, r) * 0.25, y: M.y, vx: tilf(-120, 120), vy: tilf(-200, -40), g: 900, r: tilf(2, 4), farve: ["#e7a04c", "#6a3518", "#6fcf3a"][Math.floor(Math.random() * 3)], liv: 0.7 });
          if (tTid >= 2.3) {
            tygger = false; synk();
            antalSpist++; $("tal").textContent = antalSpist;
            const el = $("taeller"); el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
            efterSpisning(); sæt("reagerer");
          }
          break;
        case "reagerer":
          // munden: puster af chili, rækker tunge af sokker, klaprer tænder af is
          m.åbenMål = reaktion === "chili" ? 0.55 + Math.sin(t * 14) * 0.2 : reaktion === "bleh" ? 0.45 : reaktion === "is" ? 0.12 + Math.abs(Math.sin(t * 30)) * 0.12 : 0;
          if (reaktion === "chili") m.tunge = 0.8;
          if (reaktion === "chili" && Math.random() < dt * 12)                    // damp ud af ørerne
            for (const s of [-1, 1]) partikler.push({ type: "damp", x: mand.x + s * r * 1.05, y: mand.y, vx: s * tilf(40, 90), vy: tilf(-140, -80), r: tilf(6, 10), vokser: 20, liv: 0.9 });
          if (reaktion === "chili" && Math.random() < dt * 4)                     // sved
            partikler.push({ type: "prik", x: mand.x + tilf(-0.8, 0.8) * r, y: mand.y - r * 0.6, vx: 0, vy: 30, g: 400, r: 4, farve: "#9fd8ff", liv: 0.8 });
          if (reaktion === "is" && Math.random() < dt * 10)
            partikler.push({ type: "prik", x: mand.x + tilf(-1.5, 1.5) * r, y: mand.y - r * 1.4, vx: tilf(-20, 20), vy: tilf(40, 90), g: 0, r: tilf(3, 6), farve: "#ffffff", liv: 1.5 });
          if (tTid >= 2.4 && tTid - dt < 2.4 && spist.length >= 8) { bøvs(); m.åben = 0.8; m.mave = 1; for (let i = 0; i < 6; i++) partikler.push({ type: "damp", x: M.x, y: M.y, vx: tilf(-80, 80), vy: tilf(-60, 20), r: 8, vokser: 30, liv: 0.8 }); }
          if (tTid >= (spist.length >= 8 ? 3.4 : 2.6)) {
            m.tintMål = 0; m.glad = 0; m.tunge = 0;
            nyBurger(); fra = { x: -bredde, y: tallerken.y }; pos.x = fra.x; pos.y = fra.y;
            sæt("ny"); ding();
          }
          break;
        case "ny":                                     // en ny bolle glider ind på tallerkenen
          pos.x += (tallerken.x - pos.x) * Math.min(1, dt * 6); pos.y = tallerken.y;
          if (tTid > 0.5) sæt("bygger");
          break;
      }
      m.tunge = Math.max(0, m.tunge - (tilstand === "reagerer" ? 0 : dt * 3));
      opdaterMand(dt, t);
      opdaterPartikler(dt);
      // en hånd viser, hvad man kan gøre, hvis der ikke sker noget
      bakkeEl.querySelectorAll(".kig").forEach(b => b.classList.remove("kig"));
      if (tilstand === "bygger" && inaktiv > 6 && !harTop() && lag.length < 4) bakkeEl.children[Math.floor(t / 2) % 12]?.classList.add("kig");
    }

    function tegnHånd(t) {                            // viser at man trækker burgeren hen til munden
      if (tilstand !== "bygger" || !harTop() || inaktiv < 3.5) return;
      const p = (t % 2) / 1.6;
      if (p > 1) return;
      const M = mund(), a = { x: tallerken.x, y: tallerken.y - burgerHøjde() * zoom * 0.5 };
      const x = a.x + (M.x - a.x) * p, y = a.y + (M.y - a.y) * p;
      ctx.globalAlpha = Math.sin(p * Math.PI);
      ctx.font = `${Math.round(mand.r * 0.5)}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillText("👆", x, y);
      ctx.globalAlpha = 1;
    }

    function tegn(t) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(bg, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      tegnMand(t);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(disk, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      tegnHænder(t);
      tegnTallerken();
      if (lag.length) tegnBurger();
      tegnPartikler();
      tegnHånd(t);
    }

    let sidst = performance.now(), tid = 0;
    function loop(nuT) {
      const dt = klem((nuT - sidst) / 1000, 0, 0.05);
      sidst = nuT; tid += dt;
      opdater(dt, tid);
      tegn(tid);
      requestAnimationFrame(loop);
    }

    // ---------- Styring: træk burgeren, eller tryk på manden ----------
    function iBurgeren(x, y) {
      const h = burgerHøjde() * skala, b = bredde * skala;
      return x > pos.x - b * 0.7 && x < pos.x + b * 0.7 && y > pos.y - h - b * 0.2 && y < pos.y + b * 0.15;
    }
    cv.addEventListener("pointerdown", e => {
      lydKlar(); inaktiv = 0;
      if (tilstand !== "bygger" || trukket !== null) return;
      if (Math.hypot(e.clientX - mand.x, e.clientY - mand.y) < mand.r * 1.1) {   // tryk på manden
        if (lag.length >= 2) spis(); else { m.bryn = 1; hm(); }
        return;
      }
      if (lag.length >= 2 && iBurgeren(e.clientX, e.clientY)) {
        trukket = { id: e.pointerId, dx: pos.x - e.clientX, dy: pos.y - e.clientY, vx: 0, vy: 0, t: performance.now() };
        try { cv.setPointerCapture(e.pointerId); } catch (_) {}
        sæt("trækker");
      }
    });
    cv.addEventListener("pointermove", e => {
      if (!trukket || e.pointerId !== trukket.id) return;
      const nx = e.clientX + trukket.dx, ny = e.clientY + trukket.dy, tt = performance.now(), dt = Math.max(1, tt - trukket.t) / 1000;
      trukket.vx = (nx - pos.x) / dt; trukket.vy = (ny - pos.y) / dt; trukket.t = tt;
      svingV -= (nx - pos.x) * 0.004;                                                  // burgeren svajer, når den flyttes
      pos.x = nx; pos.y = ny;
    });
    function slip(e) {
      if (!trukket || e.pointerId !== trukket.id) return;
      const M = mund(), h = burgerHøjde() * skala, cx = pos.x, cy = pos.y - h * 0.5;
      const d = Math.hypot(cx - M.x, cy - M.y);
      // ind i munden, hvis den er tæt på — eller er smidt i retning af den
      const mod = ((M.x - cx) * trukket.vx + (M.y - cy) * trukket.vy) / (d || 1);
      trukket = null;
      if (d < mand.r * 1.3 || (mod > 500 && d < mand.r * 4)) spis(); else sæt("tilbage");
    }
    cv.addEventListener("pointerup", slip);
    cv.addEventListener("pointercancel", slip);

    // ---------- Bakken med knapper ----------
    function flaske(farve) {                                  // en klemmeflaske til ketchup og sennep
      const c = document.createElement("canvas"), pd = Math.min(window.devicePixelRatio || 1, 2);
      c.width = c.height = Math.round(54 * pd);
      const g = c.getContext("2d");
      g.setTransform(pd, 0, 0, pd, 0, 0); g.translate(27, 29); g.rotate(-0.35);
      g.fillStyle = "#ffffff"; g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(-3, -24); g.lineTo(3, -24); g.lineTo(6, -15); g.lineTo(-6, -15); g.closePath(); g.fill(); g.stroke();   // tud
      rundKasse(g, -8, -16, 16, 6, 2); g.fill(); g.stroke();
      rundKasse(g, -11, -11, 22, 34, 8); g.fillStyle = farve; g.fill(); g.stroke();                                              // flasken
      g.fillStyle = "rgba(255,255,255,.45)"; rundKasse(g, -7, -7, 5, 24, 2.5); g.fill();
      return c;
    }
    const IKON_H = { bolle: 18, boef: 18, ost: 6, salat: 12, tomat: 12, loeg: 12, agurk: 12, bacon: 10, aeg: 16, ketchup: 6, sennep: 6, top: 24 };   // tykkere lag på knapperne, så de kan ses
    function lavKnap(type) {
      const d = ING[type], b = document.createElement("button");
      b.className = "ing" + (d.sjov !== undefined || d.emoji ? " sjov" : "");
      b.setAttribute("aria-label", type);
      if (d.emoji) b.textContent = d.emoji;
      else if (type === "ketchup" || type === "sennep") b.appendChild(flaske(type === "ketchup" ? "#d8261c" : "#f2b705"));
      else {                                                   // en lille tegning af ingrediensen
        const c = document.createElement("canvas"), pd = Math.min(window.devicePixelRatio || 1, 2);
        c.width = c.height = Math.round(54 * pd);
        const g = c.getContext("2d"), w = 44, h = IKON_H[type], y = 27 + h / 2 - (type === "ost" || type === "ketchup" || type === "sennep" ? 8 : 0);
        g.setTransform(pd, 0, 0, pd, 27 * pd, y * pd);
        g.lineJoin = "round"; g.lineCap = "round";
        tegnLag(g, type, w, h, 42);
        b.appendChild(c);
      }
      b.addEventListener("pointerdown", e => { e.preventDefault(); læg(type); });
      return b;
    }
    LÆKRE.forEach(t => bakkeEl.appendChild(lavKnap(t)));
    bakkeEl.appendChild(Object.assign(document.createElement("div"), { className: "linjeskift" }));
    SJOVE.forEach(t => bakkeEl.appendChild(lavKnap(t)));
    const skrald = Object.assign(document.createElement("button"), { className: "ing", textContent: "🗑️" });
    skrald.setAttribute("aria-label", "Smid burgeren ud");
    skrald.addEventListener("pointerdown", e => { e.preventDefault(); skraldespand(); });
    bakkeEl.appendChild(skrald);

    Effekter.vedStørrelse(layout);
    layout();
    nyBurger();
    pos.x = tallerken.x; pos.y = tallerken.y;
    requestAnimationFrame(loop);
  </script>
</body>
