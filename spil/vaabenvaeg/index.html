<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#11141c">
  <meta name="description" content="Våbenvæggen: se et våben fra siden og hold fingeren nede for at skyde — mundingsild, røg og hylstre, der klirrer på bordet. Et spil i Spilkassen.">
  <link rel="icon" href="../../favicon.png">
  <title>Våbenvæggen · Spilkassen</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body>
  <canvas id="scene" aria-label="Et våben set fra siden på et bord. Hold fingeren nede for at skyde."></canvas>

  <header class="top">
    <a class="rund" href="../../" aria-label="Tilbage til Spilkassen">🏠</a>
    <button class="rund" id="lyd" type="button" aria-label="Lyd" aria-pressed="true">🔊</button>
  </header>

  <!-- Ladeknappen: skifter magasinet (det sker også af sig selv, når det er tomt) -->
  <button class="stor-knap" id="ladKnap" type="button" aria-label="Skift magasin">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M38 24a14 14 0 1 1-4.1-9.9" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M36 5v11H25" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- Lyddæmperen: vises kun for våben, der kan få en skruet på -->
  <button class="stor-knap dæmper-knap" id="dæmperKnap" type="button" aria-label="Lyddæmper" aria-pressed="false" hidden>
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="19" width="9" height="10" rx="2" fill="currentColor" opacity=".6"/><rect x="12" y="13" width="33" height="22" rx="6" fill="none" stroke="currentColor" stroke-width="4"/><path d="M20 14v20M27 14v20" stroke="currentColor" stroke-width="3"/></svg>
  </button>

  <nav class="våbenbar" id="våbenbar" aria-label="Vælg våben"></nav>
  <div class="tip" id="tip" aria-hidden="true"><span>👆</span></div>
  <div class="henter" id="henter">Henter våbnene …</div>

  <script type="module" src="spil.js"></script>
</body>
</html>
