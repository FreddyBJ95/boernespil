<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140f22">
  <meta name="description" content="Våbensimulator: sving lyssværdet og ildsværdet, og prøv pistol, revolver, haglgevær, stormgevær og snigskyttegevær på skydebanen. Et 3D-spil i Spilkassen.">
  <link rel="icon" href="../../favicon.png">
  <title>Våbensimulator · Spilkassen</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body data-tilstand="sværd">
  <canvas id="scene" aria-label="Skydebanen i skumringen og dit våben"></canvas>

  <!-- Snigskyttens kikkert: sort rundt om, trådkors i midten -->
  <div id="kikkert" class="kikkert" hidden aria-hidden="true">
    <svg viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid meet">
      <g stroke="#0b0b0b" fill="none">
        <line x1="-100" y1="0" x2="-14" y2="0" stroke-width="2.2"/><line x1="14" y1="0" x2="100" y2="0" stroke-width="2.2"/>
        <line x1="0" y1="-100" x2="0" y2="-14" stroke-width="2.2"/><line x1="0" y1="14" x2="0" y2="100" stroke-width="2.2"/>
        <line x1="-14" y1="0" x2="14" y2="0" stroke-width="0.6"/><line x1="0" y1="-14" x2="0" y2="14" stroke-width="0.6"/>
        <g stroke-width="0.8"><line x1="-4" y1="20" x2="4" y2="20"/><line x1="-6" y1="30" x2="6" y2="30"/><line x1="-4" y1="40" x2="4" y2="40"/><line x1="-6" y1="50" x2="6" y2="50"/>
          <line x1="20" y1="-3" x2="20" y2="3"/><line x1="30" y1="-4" x2="30" y2="4"/><line x1="40" y1="-3" x2="40" y2="3"/><line x1="-20" y1="-3" x2="-20" y2="3"/><line x1="-30" y1="-4" x2="-30" y2="4"/><line x1="-40" y1="-3" x2="-40" y2="3"/></g>
      </g>
      <circle r="0.9" fill="#ff2a1a"/>
    </svg>
  </div>

  <header class="top">
    <a class="rund" href="../../" aria-label="Tilbage til Spilkassen">🏠</a>
    <div class="top-højre">
      <button class="rund" id="lyd" type="button" aria-label="Lyd" aria-pressed="true">🔊</button>
    </div>
  </header>

  <!-- Under skydningen: patroner, ladning og "kast noget op" · under sværdet: tænd/sluk og farver -->
  <section class="hud" aria-label="Våbnets knapper">
    <div class="ammo" id="ammo" aria-label="Patroner tilbage" hidden></div>
    <div class="knapper våben-knapper">
      <button class="stor-knap" id="kastKnap" type="button" aria-label="Kast dåser og frugt op i luften">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 38c6-18 16-26 28-28" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 7"/><rect x="29" y="4" width="12" height="16" rx="2" fill="#e8483c" stroke="#fff" stroke-width="2"/><path d="M29 8h12M29 16h12" stroke="#fff" stroke-width="1.5"/></svg>
      </button>
      <button class="stor-knap lad" id="ladKnap" type="button" aria-label="Lad våbnet">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M38 24a14 14 0 1 1-4.1-9.9" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M36 5v11H25" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="knapper sværd-knapper">
      <div class="farver" id="farver" role="group" aria-label="Sværdets farve"></div>
      <button class="stor-knap" id="tændKnap" type="button" aria-label="Tænd eller sluk sværdet">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6v17" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M14.5 12.5a15 15 0 1 0 19 0" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </section>

  <nav class="våbenbar" id="våbenbar" aria-label="Vælg våben"></nav>
  <div class="tip" id="tip" aria-hidden="true"><span>👆</span></div>
  <div class="henter" id="henter">Gør våbnene klar …</div>

  <script type="module" src="../3d-faelles/start.js" data-spil="../vaabensimulator/spil.js"></script>
</body>
</html>
