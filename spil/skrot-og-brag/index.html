<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5aa9ff">
  <link rel="icon" href="../../favicon.png">
  <title>Skrot &amp; Brag · Spilkassen</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body>
  <canvas id="scene" aria-label="Din bil og det, du skal køre ind i"></canvas>
  <div id="bobler" class="bobler" aria-hidden="true"></div>

  <!-- Værkstedet: byg bilen og vælg, hvad den skal køre ind i -->
  <main id="garage" class="garage">
    <header class="top">
      <a class="rund" href="../../" aria-label="Tilbage til Spilkassen">🏠</a>
      <h1 class="titel" aria-label="Skrot og Brag"><span>S</span><span>k</span><span>r</span><span>o</span><span>t</span><i>&amp;</i><span>B</span><span>r</span><span>a</span><span>g</span></h1>
      <div class="top-højre">
        <button class="rund" id="rolig" aria-label="Rolige effekter" aria-pressed="false">🐢</button>
        <button class="rund" id="lyd" aria-label="Lyd" aria-pressed="true">🔊</button>
      </div>
    </header>
    <section class="dok" id="dok">
      <div class="panel byg">
        <div class="faner" id="faner" role="tablist" aria-label="Bilens dele"></div>
        <div class="dele" id="dele" role="tabpanel"></div>
      </div>
      <div class="panel baner-panel">
        <div class="baner" id="baner" role="group" aria-label="Hvad vil du køre ind i?"></div>
        <button class="kør-knap" id="start" disabled aria-label="Kør">▶</button>
      </div>
    </section>
  </main>

  <!-- Under kørslen -->
  <section id="kørsel" class="kørsel" hidden>
    <div class="hud-top">
      <button class="rund" id="tilbage" aria-label="Til værkstedet">🔧</button>
      <div class="måler" role="img" aria-label="Hvor meget der er væltet" id="måler">
        <span class="mål-ikon" id="målIkon"></span>
        <div class="bar"><i id="fyld"></i><b id="s1">★</b><b id="s2">★</b><b id="s3">★</b></div>
      </div>
      <button class="rund" id="pause" aria-label="Pause"><span class="pause-ikon"></span></button>
    </div>
    <div class="styring">
      <div class="side">
        <button class="pedal bak" id="bak" aria-label="Bak, hold nede">◀</button>
        <button class="pedal dyt" id="dyt" aria-label="Dyt med hornet">📯</button>
      </div>
      <div class="side højre">
        <span class="tip" id="tip" aria-hidden="true">👇</span>
        <button class="pedal boost" id="boost" aria-label="Raketfart, hold nede">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" class="tank-bund"/><circle cx="50" cy="50" r="46" class="tank" id="tank"/></svg>
          <span>🚀</span>
        </button>
        <button class="pedal gas" id="gas" aria-label="Kør, hold nede">▶</button>
      </div>
    </div>
  </section>

  <!-- Resultat og pause -->
  <div id="dialog" class="overlay" hidden>
    <section class="kort" role="dialog" aria-modal="true" aria-labelledby="dialogTitel">
      <div class="stjerner" id="stjerner"></div>
      <h2 id="dialogTitel">Sikke et brag!</h2>
      <p class="resultat" id="dialogTal"></p>
      <div class="knaprække">
        <button class="knap" id="igen" aria-label="Prøv igen">🔁</button>
        <button class="knap stor" id="fortsæt" aria-label="Næste bane">▶</button>
        <button class="knap" id="tilVærksted" aria-label="Til værkstedet">🔧</button>
      </div>
      <div class="pausevalg" id="pausevalg">
        <button class="valg" id="lydP" aria-label="Lyd">🔊</button>
        <button class="valg" id="roligP" aria-label="Rolige effekter">🐢</button>
      </div>
    </section>
  </div>
  <div id="status" role="status" class="status">Henter værkstedet …</div>

  <script type="module">
    import('./spil.mjs').catch(fejl => {
      console.error(fejl);
      const status = document.querySelector('#status');
      status.textContent = 'Spillet kunne ikke starte. Prøv at genindlæse siden.';
      status.hidden = false;
    });
  </script>
</body>
</html>
