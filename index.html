<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spil for ungerne 🎈</title>
  <link rel="stylesheet" href="style.css">

  <!-- PWA: gør siden installerbar som app -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#120b2e">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Børnespil">
</head>
<body>
  <!-- Baggrunden: billeder fra spillene, der ruller langsomt forbi (som på Netflix). Rækkerne laves nederst i scriptet. -->
  <div class="billedvaeg" id="billedvaeg" aria-hidden="true"></div>
  <div class="vaeg-skygge" aria-hidden="true"></div>

  <header>
    <h1>Spil for ungerne</h1>
    <p class="undertekst">✨ Tryk på et kort og leg ✨</p>
    <button class="installer" id="installer" hidden>💻 Installér som app på computeren</button>
  </header>

  <!-- Det store banner øverst: de nyeste Broekraft-verdener skifter af sig selv. ▶ Spil åbner den verden, der vises. -->
  <section class="helt" id="helt" aria-label="Nyt i Broekraft">
    <div class="helt-billeder" id="heltBilleder"></div>
    <div class="helt-indhold">
      <div class="helt-maerke">⛏️ BROEKRAFT <span>NYT</span></div>
      <h2 class="helt-navn" id="heltNavn"></h2>
      <p class="helt-tekst" id="heltTekst"></p>
      <a class="helt-knap" id="heltKnap" href="spil/broekraft/">▶ Spil</a>
    </div>
    <div class="helt-prikker" id="heltPrikker"></div>
  </section>

  <!-- Faner: vælg hvilken slags spil der vises. Appen husker den sidste fane. -->
  <nav class="faner" aria-label="Kategorier">
    <button class="fane" data-vis="alle"><span class="fane-ikon">⭐</span><span class="fane-navn">Alle</span></button>
    <button class="fane" data-vis="3d"><span class="fane-ikon">🧊</span><span class="fane-navn">3D</span></button>
    <button class="fane" data-vis="2d"><span class="fane-ikon">🎮</span><span class="fane-navn">2D</span></button>
    <button class="fane" data-vis="kreativ"><span class="fane-ikon">🎨</span><span class="fane-navn">Tegn &amp; musik</span></button>
  </nav>

  <!-- Spillene i kategorier. Tilføj et nyt spil ved at kopiere et kort ind i den rigtige kategori.
       data-ny="ÅÅÅÅ-MM-DD" giver et NY!-mærke i tre uger · data-billede = et billede fra spillet bag kortet
       data-anim = hvordan ikonet bevæger sig: hop, svæv, vip, sving, pust, snur, kør, flyv -->
  <main>
    <section class="kategori" data-kat="3d">
      <h2 class="kat-titel"><span>🧊</span>3D-spil</h2>
      <div class="spil-gitter">
        <a class="spil-kort plakat" href="spil/broekraft/" style="--farve:#7cc35a" data-ny="2026-09-27" data-billede="billeder/graesoe.jpg" data-anim="sving">
          <span class="ikon">⛏️</span><span class="navn">Broekraft</span>
        </a>
        <a class="spil-kort plakat" href="spil/fisk/" style="--farve:#4895ef" data-ny="2026-09-29" data-billede="billeder/fisk.jpg" data-anim="svæv">
          <span class="ikon">🎣</span><span class="navn">Mærkelige fisk</span>
        </a>
        <a class="spil-kort plakat" href="spil/rulle-rasmus/" style="--farve:#2f8cff" data-ny="2026-09-30" data-billede="billeder/rasmus.jpg" data-anim="vip">
          <span class="ikon">🏁</span><span class="navn">Rulle Rasmus</span>
        </a>
      </div>
    </section>

    <section class="kategori" data-kat="2d">
      <h2 class="kat-titel"><span>🎮</span>2D-spil</h2>
      <div class="spil-gitter">
        <a class="spil-kort" href="spil/balloner/" style="--farve:#2ec4f1" data-ny="2026-09-30" data-anim="svæv">
          <span class="ikon">🎈</span><span class="navn">Pop ballonerne</span>
        </a>
        <a class="spil-kort" href="spil/vask/" style="--farve:#22b8cf" data-ny="2026-09-30" data-anim="kør">
          <span class="ikon">🚜</span><span class="navn">Vaskehallen</span>
        </a>
        <a class="spil-kort" href="spil/slange/" style="--farve:#5fd068" data-anim="vip">
          <span class="ikon">🐍</span><span class="navn">Fjollet Slange</span>
        </a>
      </div>
    </section>

    <section class="kategori" data-kat="kreativ">
      <h2 class="kat-titel"><span>🎨</span>Tegn &amp; musik</h2>
      <div class="spil-gitter">
        <a class="spil-kort" href="spil/tegne/" style="--farve:#ff6fa0" data-anim="vip">
          <span class="ikon">🎨</span><span class="navn">Tegn!</span>
        </a>
        <a class="spil-kort" href="spil/piano/" style="--farve:#ff5c8a" data-anim="hop">
          <span class="ikon">🎹</span><span class="navn">Dyre-piano</span>
        </a>
      </div>
    </section>

  </main>

  <!-- Til de voksne: ligger for sig selv nederst, så børnene ikke tror, det er et spil -->
  <footer class="voksne">
    <p class="voksne-titel">For voksne</p>
    <a class="voksne-link" href="tilslut/">📷 Spil Broekraft sammen — forbind tabletten til computeren</a>
  </footer>

  <script>
    // ----- Faner: vis én kategori eller alle -----
    const faner = document.querySelectorAll(".fane"), kategorier = document.querySelectorAll(".kategori");
    function vis(kat) {
      faner.forEach(f => f.setAttribute("aria-pressed", f.dataset.vis === kat));
      kategorier.forEach(k => { k.hidden = kat !== "alle" && k.dataset.kat !== kat; });
      try { localStorage.setItem("forside-fane", kat); } catch (_) {}
    }
    faner.forEach(f => f.addEventListener("click", () => vis(f.dataset.vis)));
    let startFane = "alle";
    try { startFane = localStorage.getItem("forside-fane") || "alle"; } catch (_) {}
    vis([...faner].some(f => f.dataset.vis === startFane) ? startFane : "alle");

    // ----- NY!-mærker på nye spil (i tre uger) -----
    document.querySelectorAll("[data-ny]").forEach(k => {
      if (Date.now() - Date.parse(k.dataset.ny) > 21 * 864e5) return;
      const m = document.createElement("span");
      m.className = "ny-maerke"; m.textContent = "NY!";
      k.appendChild(m);
    });

    // ----- Kortene: billeder bag 3D-spillene, og ikonerne bevæger sig hver i sit tempo -----
    document.querySelectorAll(".spil-kort").forEach((k, i) => {
      if (k.dataset.billede) k.style.setProperty("--billede", `url("${k.dataset.billede}")`);
      k.style.setProperty("--forsinkelse", `${-(i * 0.37) % 3}s`);           // ikke alle hopper på samme tid
      k.style.setProperty("--glimt", `${(i * 1.3) % 7}s`);                    // lysglimtet kommer forskudt
    });

    // ----- Billedvæggen: fire rækker, der ruller hver sin vej -----
    const BILLEDER = ["fyrvaerkeri", "tornado", "nuke", "brandby", "dino", "hav", "slik", "sky", "pirat", "droner",
      "pariserhjul", "underverden", "graesoe", "skydebane", "nytaar", "fisk", "svampesky", "rasmus"];
    const vaeg = document.getElementById("billedvaeg");
    for (let r = 0; r < 4; r++) {
      const række = document.createElement("div");
      række.className = "vaeg-raekke" + (r % 2 ? " baglaens" : "");
      række.style.animationDuration = `${70 + r * 12}s`;
      const liste = BILLEDER.map((_, i) => BILLEDER[(i * 5 + r * 3) % BILLEDER.length]);
      for (const navn of [...liste, ...liste]) {                               // to gange, så den kan rulle i ring
        const img = new Image(); img.src = `billeder/${navn}.jpg`; img.alt = ""; img.decoding = "async"; img.loading = r > 1 ? "lazy" : "eager";
        række.appendChild(img);
      }
      vaeg.appendChild(række);
    }

    // ----- Banneret: de nye verdener skifter hvert sjette sekund. ▶ Spil åbner den verden, der vises -----
    const HELTE = [
      { billede: "fyrvaerkeri", verden: "fyrvaerkeri", navn: "🎆 Fyrværkeri", tekst: "Pariserhjul, droneshow, kæmperaket — og nedtælling til nytår" },
      { billede: "tornado", verden: "tornado", navn: "🌪️ Ildtornadoerne", tekst: "Bliv suget op i en tornado — og sluk ilden med brandslangen" },
      { billede: "nuke", verden: "atom", navn: "☢️ NUKE-banen", tekst: "Tryk på den røde knap, og se missilerne flyve" },
      { billede: "brandby", verden: "brandby", navn: "🚒 Brandmandsbyen", tekst: "Kør brandbilen med sirene, og sluk ilden med vandkanonen" },
    ];
    const heltBilleder = document.getElementById("heltBilleder"), prikker = document.getElementById("heltPrikker");
    let heltNr = 0, heltTimer = 0;
    HELTE.forEach((h, i) => {
      const img = new Image(); img.src = `billeder/${h.billede}.jpg`; img.alt = ""; heltBilleder.appendChild(img);
      const p = document.createElement("button"); p.setAttribute("aria-label", h.navn);
      p.addEventListener("click", () => visHelt(i, true)); prikker.appendChild(p);
    });
    function visHelt(i, trykket = false) {
      heltNr = (i + HELTE.length) % HELTE.length;
      const h = HELTE[heltNr];
      heltBilleder.querySelectorAll("img").forEach((img, j) => img.classList.toggle("vist", j === heltNr));
      prikker.querySelectorAll("button").forEach((p, j) => p.classList.toggle("vist", j === heltNr));
      const navn = document.getElementById("heltNavn"), tekst = document.getElementById("heltTekst");
      navn.textContent = h.navn; tekst.textContent = h.tekst;
      for (const el of [navn, tekst]) { el.classList.remove("ind"); void el.offsetWidth; el.classList.add("ind"); }
      clearTimeout(heltTimer); heltTimer = setTimeout(() => visHelt(heltNr + 1), trykket ? 12000 : 6000);
    }
    visHelt(0);
    // Broekraft åbner i den verden, man valgte i banneret
    document.getElementById("heltKnap").addEventListener("click", () => {
      const id = HELTE[heltNr].verden;
      try {
        localStorage.setItem("broekraft-verden", JSON.stringify(id));
        const hentet = JSON.parse(localStorage.getItem("broekraft-hentet") || "[]");
        if (Array.isArray(hentet) && !hentet.includes(id)) { hentet.push(id); localStorage.setItem("broekraft-hentet", JSON.stringify(hentet)); }
      } catch (_) {}
    });
  </script>

  <!-- Registrér service worker (offline + installerbar) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
    // Installér som app på computeren: knappen vises kun, når browseren tilbyder det (Chrome og Edge)
    let installering = null;
    const installKnap = document.getElementById("installer");
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installering = e; installKnap.hidden = false; });
    installKnap.addEventListener("click", async () => {
      if (!installering) return;
      installering.prompt();
      try { await installering.userChoice; } catch (_) {}
      installering = null; installKnap.hidden = true;
    });
    window.addEventListener("appinstalled", () => { installKnap.hidden = true; });
  </script>
</body>
</html>
